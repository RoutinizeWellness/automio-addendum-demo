function title(k,h,s,actions=''){return `<div class="topline"><div><div class="eyebrow">${k}</div><h1>${h}</h1><p class="sub">${s}</p></div>${actions?`<div class="actions">${actions}</div>`:''}</div>`}
function card(h,sub,body,action=''){return `<section class="card"><div class="card-head"><div><h2>${h}</h2>${sub?`<small>${sub}</small>`:''}</div>${action}</div>${body}</section>`}
function metric(label,n,note,tone=''){return `<div class="metric ${tone}"><div class="eyebrow">${label}</div><strong class="num">${n}</strong><small>${note}</small></div>`}
function foot(){return `<div class="footer-note"><span>Escenari fictici · jornada de mostra · dades guardades només en aquest navegador.</span><div class="actions"><button class="mini-link" onclick="sources()">Fonts i límits</button><button class="btn ghost danger" onclick="resetAsk()">Reiniciar demo</button></div></div>`}
function pendingCount(){return (state.treatments['TR-041'].status==='Pendent'?1:0)+(state.quality['OF-121'].certificate?0:1)}
function overview(){let pending=pendingCount();return title('Jornada de mostra · vista del responsable','El taller, en una sola vista','Sis ordres d’exemple, entre sèrie, prototip i conjunt. El que avança, el que espera i el que cal revisar.',`<button class="btn" onclick="go('summary')">Preparar resum de jornada</button>`)+`<div class="metrics">${metric('Ordres obertes','6','144 unitats · cartera fictícia')}${metric('Rutes diferents','3','Sèrie, prototip i muntatge')}${metric('Pendents prioritaris',pending,'Confirmacions i documents','amber')}${metric('Parts de taller',state.parts.length,'Registrats en la demo')}</div><div class="alert"><div class="alert-content"><span class="symbol">!</span><div><b>${state.treatments['TR-041'].status==='Pendent'?'OF-118 · falta confirmar el tractament':'OF-118 · retorn actualitzat, pendent de revisar la ruta'}</b><p>${state.scenario?'Escenari +1 jornada actiu. La proposta de rectificat es desplaça, no es confirma cap entrega.':'El lot no passa a rectificat per marcar una casella. Producció ha de contrastar la confirmació.'}</p></div></div><button class="btn secondary small" onclick="choose('OF-118')">Obrir ordre</button></div><div class="grid">${card('Ordres obertes','Seguiment de lots · quantitats i fases de mostra',ordersTable(baseOrders),`<button class="mini-link" onclick="go('orders')">Veure totes les ordres</button>`)}${card('El que demana una decisió','Sense alertes inventades sobre la planta real',`<div class="card-body stack"><div class="event"><span class="dot amber"></span><div><b>Retorn del tractament · OF-118</b><p>${esc(state.treatments['TR-041'].return)}. ${state.treatments['TR-041'].status==='Pendent'?'Demanar confirmació abans de revisar el pla.':'Confirmació simulada registrada. Encara cal revisar producció.'}</p><button class="mini-link" onclick="go('treatments')">Revisar seguiment</button></div></div><div class="event"><span class="dot ${state.quality['OF-121'].certificate?'':'amber'}"></span><div><b>Certificat de tractament · OF-121</b><p>${state.quality['OF-121'].certificate?'Revisió marcada a la demo. No allibera cap lot real.':'Document d’exemple rebut, però sense revisió marcada.'}</p><button class="mini-link" onclick="openQuality('OF-121')">Obrir documentació</button></div></div><div class="event"><span class="dot"></span><div><b>Relleu de taller</b><p>Les últimes notes queden vinculades a cada ordre, sense substituir les anteriors.</p><button class="mini-link" onclick="go('parts')">Registrar un part</button></div></div></div>`)}</div><div class="grid equal">${card('Moviments de la jornada','Últims registres de mostra i accions que provis',`<div class="card-body stack">${[...state.events.slice(0,3).map(e=>({title:e.text,note:'Canvi només en aquesta demo',time:e.time})),...state.parts.slice(0,3).map(p=>({title:p.order+' · '+p.type,note:p.note,time:p.time}))].slice(0,5).map(e=>`<div class="event"><span class="dot"></span><div><b>${esc(e.title)}</b><p>${esc(e.note)}</p></div><time>${esc(e.time)}</time></div>`).join('')}</div>`)}${card('Distribució per fase','Nombre de lots · no és un indicador real de rendiment',`<div class="card-body">${['Tallat de dents','Tractament','Rectificat','Control final','Revisió tècnica','Preparació muntatge'].map((p,i)=>`<div class="chart-row"><span>${p}</span><div class="progress ${i===1?'amber':''}"><i style="width:16.667%"></i></div><b>1 lot</b></div>`).join('')}<p class="tiny muted" style="margin:19px 0 0">No es calcula OEE, capacitat real ni estalvi. Caldria validar torns, rutes i fonts abans d’implantar-ho.</p></div>`)}</div>`}
function orderState(o){if(o.id==='OF-118'&&state.treatments['TR-041'].status!=='Pendent')return pill('Retorn per revisar','green');if(o.id==='OF-121'&&state.quality[o.id].certificate)return pill('Revisió preparada','green');return pill(o.state,o.tone)}
function ordersTable(list){return `<div class="table-wrap"><table><thead><tr><th>Ordre / lot</th><th>Producte</th><th>Fase actual</th><th>Quantitat</th><th>Seguiment</th><th></th></tr></thead><tbody>${list.length?list.map(o=>`<tr><td><button class="row-button" onclick="choose('${o.id}')">${o.id}</button><br><small>${o.lot}</small></td><td><strong>${o.product}</strong><small>${o.revision}</small></td><td>${o.stage}${progress(Math.round(o.route.filter(x=>x===1).length/5*100))}</td><td>${o.qty} ${o.id==='OF-123'?'conjunts':'peces'}</td><td>${orderState(o)}</td><td><button class="btn secondary small" onclick="choose('${o.id}')">Obrir</button></td></tr>`).join(''):`<tr><td colspan="6"><div class="empty">Cap ordre coincideix amb la cerca.</div></td></tr>`}</tbody></table></div>`}
function orders(){return title('Ordres i lots','Cada ordre, amb el seu context','Ruta, parts de taller i documentació al mateix lloc. Tot l’escenari és fictici.')+`<div class="toolbar"><input type="search" id="orderSearch" placeholder="Cercar ordre, lot o producte" aria-label="Cercar ordres" value="${esc(query)}" oninput="searchOrders(this.value)"><select aria-label="Filtrar ordres" onchange="filterOrders(this.value)"><option value="all">Totes les fases</option><option value="amber" ${filter==='amber'?'selected':''}>Amb revisió pendent</option><option value="green" ${filter==='green'?'selected':''}>En curs</option></select><span class="tagline">6 ordres · exemple</span></div>${card('Cartera de producció','No són comandes ni terminis d’Addendum',`<div id="ordersTable">${ordersTable(filteredOrders())}</div>`)}${card('Una ordre no és només una fila','Obre OF-118 per seguir el cas complet',`<div class="card-body"><div class="route">${['Lot i revisió','Ruta de taller','Parts i incidències','Tractament','Qualitat i resum'].map((x,i)=>`<div class="phase"><small>0${i+1}</small><b>${x}</b><span>Context vinculat</span></div>`).join('')}</div></div>`)}`}
function filteredOrders(){let q=query.toLowerCase();return baseOrders.filter(o=>(filter==='all'||o.tone===filter)&&[o.id,o.lot,o.product].join(' ').toLowerCase().includes(q))}function searchOrders(v){query=v;$('#ordersTable').innerHTML=ordersTable(filteredOrders())}function filterOrders(v){filter=v;$('#ordersTable').innerHTML=ordersTable(filteredOrders())}
function detail(){let o=order(selected),t=state.treatments[o.treatment],parts=state.parts.filter(p=>p.order===o.id);return `<button class="back" onclick="go('orders')">← Totes les ordres</button>`+title('Fitxa de producció · dades fictícies',`${o.id} · ${o.product}`,`Lot ${o.lot} · revisió ${o.revision} · prioritat ${o.priority.toLowerCase()}`,`<button class="btn" onclick="partModal('${o.id}')">Afegir part de taller</button>`)+`<div class="card"><div class="facts"><div class="fact"><small>Quantitat del lot</small><b>${o.qty} ${o.id==='OF-123'?'conjunts':'peces'}</b></div><div class="fact"><small>Fase de l’exemple</small><b>${o.stage}</b></div><div class="fact"><small>Previsió de mostra</small><b>${o.delivery}</b></div><div class="fact"><small>Estat de seguiment</small>${orderState(o)}</div></div><div class="card-body"><div class="eyebrow" style="margin-bottom:13px">Ruta de fabricació · seqüència inventada</div><div class="route">${o.route.map((s,i)=>`<div class="phase ${s===1?'done':s===2?'current':''}"><small>0${i+1}</small><b>${(o.routeNames||phaseNames)[i]}</b><span>${s===1?'Fet a l’exemple':s===2?'Punt de seguiment':'Pendent'}</span></div>`).join('')}</div></div><div class="info-bar">La seqüència és il·lustrativa. No defineix una ruta real, paràmetres CNC ni criteris d’acceptació.</div></div><div class="grid equal">${card('Parts vinculats a l’ordre',`${parts.length} registres · historial acumulatiu`,`<div class="card-body stack">${parts.map(p=>`<div class="event"><span class="dot ${p.type==='Incidència'?'amber':''}"></span><div><b>${esc(p.type)} · ${esc(p.id)}</b><p>${esc(p.note)}</p>${p.qty?`<p>${p.qty} peces registrades en aquest part</p>`:''}</div><time>${esc(p.time)}</time></div>`).join('')||'<div class="empty">Encara no hi ha cap part.</div>'}</div>`)}${card('Propera revisió','Informació que no s’ha de donar per feta',`<div class="card-body"><h3>${o.id==='OF-118'?'Confirmar el retorn del tractament':o.id==='OF-121'?'Revisar la documentació del lot':'Revisar la informació de la fase'}</h3><p class="tiny muted">${o.routeNames?'Context tècnic':('Tractament '+o.treatment+': '+esc(t.return))}. ${esc(t.note)}</p><div class="hr"></div><div class="actions"><button class="btn secondary small" onclick="go('treatments')">Veure tractaments</button>${o.routeNames?`<button class="btn secondary small" onclick="go('technical')">Revisió tècnica</button>`:`<button class="btn secondary small" onclick="openQuality('${o.id}')">Qualitat i documents</button>`}</div><div class="status-line amber">Cap acció d’aquesta demo allibera peces ni actualitza el pla real.</div></div>`)}</div>`}
const centers=['Torneig','Tallat de dents','Tractaments','Rectificat','Control final','Muntatge / prototip'];
function workshop(){let delayed=state.scenario;let blocks=[['OF-119|Preparació i torneig','OF-119|Lot complet','OF-122|Reserva fictícia','',''],['OF-118|Tallat acabat','OF-119|Tallat en curs','OF-119|Continuació','',''],['OF-120|Rebut','OF-118|Retorn per confirmar',delayed?'OF-118|Escenari de retorn':'OF-119|Enviament previst',delayed?'OF-119|Pendent de revisar':'',''],['OF-120|Rectificat en curs','OF-120|Continuació',delayed?'|Espai a revisar':'OF-118|Proposta condicionada',delayed?'OF-118|Proposta +1 jornada':'',''],['OF-121|Revisió documental','OF-120|Proposta de control','','OF-119|Reserva de mostra',delayed?'OF-118|Pendent de validar':'OF-118|Reserva condicionada'],['OF-122|Revisió tècnica','OF-122|Prototip condicionat','OF-123|Preparar components','OF-123|Muntatge condicionat','OF-123|Verificació prevista']];return title('Càrrega de taller','Una proposta visible, no un pla automàtic','Horitzó fictici de cinc jornades. Les franges no representen hores, torns ni capacitat real. Llisca la graella per veure tot l’horitzó.',`<button class="btn ${delayed?'secondary':''}" onclick="simulate()">${delayed?'Restablir escenari base':'Simular +1 jornada al tractament'}</button>`)+`<div class="alert"><div class="alert-content"><span class="symbol">↗</span><div><b>${delayed?'Escenari alternatiu · OF-118 es desplaça una jornada':'OF-118 · seqüència condicionada al tractament'}</b><p>${delayed?'La proposta de rectificat passa de J3 a J4. La reserva de control continua pendent de validació.':'El retorn encara no està confirmat. Pots comparar què canviaria sense tocar cap ordre real.'}</p></div></div>${pill(delayed?'SIMULACIÓ LOCAL':'ESCENARI BASE',delayed?'amber':'gray')}</div>${card('Vista de centres de treball','Noms genèrics basats en les capacitats publicades, no en les màquines reals',`<div class="table-wrap"><div class="load-grid"><div class="head">CENTRE</div>${[1,2,3,4,5].map(n=>`<div class="head">JORNADA ${n}</div>`).join('')}${centers.map((c,i)=>`<div class="center"><b>${c}</b><small>Centre fictici 0${i+1}</small></div>${blocks[i].map((b,j)=>{let p=b.split('|');return `<div>${b?`<div class="load-block ${i===2||p[1]?.includes('condicion')||p[1]?.includes('revisar')?'amber':p[1]?.includes('Reserva')?'gray':''}"><b>${p[0]}</b><span>${p[1]}</span></div>`:'<div class="load-block empty-slot">Sense proposta</div>'}</div>`}).join('')}`).join('')}</div></div><div class="schedule-note"><div class="legend"><span><i></i>Activitat de mostra</span><span><i class="amber"></i>Condicionada / a revisar</span><span><i class="gray"></i>Reserva fictícia</span></div></div>`)}<div class="grid equal">${card('Impacte de l’escenari','Comparació senzilla i explícita, no optimització',`<div class="table-wrap compact"><table><thead><tr><th>Punt</th><th>Base</th><th>Escenari actual</th></tr></thead><tbody><tr><td>Retorn OF-118</td><td>J2 · per confirmar</td><td>${delayed?'J3 · supòsit':'J2 · per confirmar'}</td></tr><tr><td>Rectificat OF-118</td><td>J3 · condicionat</td><td>${delayed?'J4 · proposta':'J3 · condicionat'}</td></tr><tr><td>Entrega al client</td><td>No validada</td><td>No validada</td></tr></tbody></table></div>`)}${card('Què ha de validar producció?','La simulació no aplica canvis al taller',`<div class="card-body stack"><div class="event"><span class="dot amber"></span><div><b>Retorn, recursos i prioritats</b><p>La data confirmada del tractament, la disponibilitat real del centre i la resta d’ordres.</p></div></div><div class="event"><span class="dot"></span><div><b>Sense promeses de capacitat</b><p>No s’han informat hores, torns ni recursos reals. Per això no apareixen percentatges d’ocupació ni estalvis.</p></div></div><button class="mini-link" onclick="go('summary')">Incloure l’escenari al resum del responsable</button></div>`)}</div>`}
function simulate(){state.scenario=!state.scenario;addEvent(state.scenario?'Simulació: tractament OF-118 +1 jornada. Proposta de rectificat a revisar.':'Escenari base restablert, sense canvis al pla real.');render();toast(state.scenario?'Simulació activada. No s’ha canviat cap pla real.':'Escenari base restablert.')}
function parts(){return title('Parts de taller','El relleu queda escrit','Registra un avanç, una incidència o una nota. Cada part s’afegeix a l’historial del lot.',`<button class="btn secondary" onclick="assistPart()">Preparar des d’una nota de mostra</button><button class="btn" onclick="partModal('OF-118')">Nou part de taller</button>`)+`<div class="metrics">${metric('Parts registrats',state.parts.length,'Historial només d’aquesta demo')}${metric('Incidències',state.parts.filter(p=>p.type==='Incidència').length,'Notes pendents de valoració','amber')}${metric('Ordres amb parts',new Set(state.parts.map(p=>p.order)).size,'Dels sis lots d’exemple')}${metric('Connexió a màquines','No','Cap inici, parada ni càrrega CNC')}</div>${card('Registre de jornada','Els nous parts no substitueixen notes anteriors',`<div class="table-wrap"><table><thead><tr><th>Part / hora</th><th>Ordre</th><th>Tipus</th><th>Quantitat</th><th>Nota de taller</th></tr></thead><tbody>${state.parts.map(p=>`<tr><td><strong>${esc(p.id)}</strong><small>${esc(p.time)}</small></td><td><button class="row-button" onclick="choose('${p.order}')">${p.order}</button><br><small>${order(p.order).product}</small></td><td>${pill(p.type,p.type==='Incidència'?'amber':'green')}</td><td>${p.qty||'—'}${p.qty?' peces':''}</td><td style="min-width:240px;max-width:450px">${esc(p.note)}</td></tr>`).join('')}</tbody></table></div>`)}${card('Terminal de taller · mostra','Una entrada ràpida, sense controlar cap màquina',`<div class="card-body"><div class="grid equal" style="margin:0"><div><h3>OF-119 · Engranatge recte</h3><p class="tiny muted">Lot LR-060 · tallat de dents · 60 peces de mostra</p><div class="actions"><button class="btn secondary" onclick="partModal('OF-119','Avanç')">Registrar avanç</button><button class="btn secondary" onclick="partModal('OF-119','Incidència')">Anotar incidència</button><button class="btn secondary" onclick="partModal('OF-119','Relleu')">Deixar relleu</button></div></div><div><div class="status-line amber" style="margin:0">Registrar peces no tanca la fase, valida toleràncies ni allibera el lot. El responsable contrasta el part.</div><p class="tiny muted" style="margin:12px 0 0">No introdueixis noms, dades de clients ni informació real.</p></div></div></div>`)}`}

function assistPart(){modal('De la nota al part · assistència simulada',`<div class="eyebrow">1. ENTRADA DE MOSTRA</div><p style="margin:10px 0 16px">«OF-118, lot LH-024. Tallat acabat. Encara no tenim confirmació del retorn del tractament. Revisar amb producció abans de moure rectificat.»</p><div class="status-line amber">És una nota preparada per a la demo. No s’analitzen missatges reals ni s’executa un model d’IA.</div><button class="btn" style="margin-top:18px" onclick="assistPreview()">Veure proposta de part</button>`)}
function assistPreview(){modal('Proposta de part · pendent de revisió',`<div class="eyebrow">2. CONTEXT REUNIT · 3. REVISIÓ HUMANA</div><div class="facts" style="margin:15px 0"><div class="fact"><small>Ordre detectada a la mostra</small><b>OF-118</b></div><div class="fact"><small>Lot de la mostra</small><b>LH-024</b></div><div class="fact"><small>Fet reportat</small><b>Tallat acabat</b></div><div class="fact"><small>Data de retorn</small><b>No confirmada</b></div></div><p class="tiny muted">El text proposa un pendent, no inventa una data ni canvia la seqüència de màquina.</p><label class="fieldlabel" for="assistNote">Nota proposada · editable</label><textarea id="assistNote">Tallat acabat segons la nota de mostra. Pendent de confirmar el retorn del tractament abans de revisar la proposta de rectificat.</textarea><label class="check"><input type="checkbox" id="assistReviewed"><span><b>He revisat el context d’aquest exemple</b><small>No equival a una validació de la realitat de planta.</small></span></label><button class="btn" style="margin-top:15px" onclick="saveAssist()">Afegir proposta revisada a l’historial</button><div id="assistError"></div>`)}
function saveAssist(){if(!$('#assistReviewed').checked||!$('#assistNote').value.trim()){$('#assistError').innerHTML='<div class="status-line red" role="alert">Revisa la nota i marca la comprovació abans de guardar.</div>';return}state.parts.unshift({id:'PT-'+String(state.parts.length+1).padStart(3,'0'),order:'OF-118',type:'Incidència',qty:0,note:$('#assistNote').value.trim(),time:'Ara · proposta revisada'});addEvent('OF-118: proposta de part de mostra revisada i afegida a l’historial.');closeModal();render();toast('Proposta revisada guardada. Sense modificar la ruta ni cap data.')}

function modal(h,body){$('#modal').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(h)}"><div class="card-head"><h2>${h}</h2><button class="close" aria-label="Tancar finestra" onclick="closeModal()">×</button></div><div class="card-body">${body}</div></section></div>`;$('#modal input, #modal select, #modal textarea, #modal button')?.focus()}function closeModal(){$('#modal').innerHTML=''}
function partModal(id,type='Avanç'){modal('Nou part · dades de mostra',`<form onsubmit="savePart(event)"><div class="split-form"><div><label class="fieldlabel" for="partOrder">Ordre de fabricació</label><select id="partOrder">${baseOrders.map(o=>`<option value="${o.id}" ${id===o.id?'selected':''}>${o.id} · ${o.lot}</option>`).join('')}</select></div><div><label class="fieldlabel" for="partType">Tipus de part</label><select id="partType">${['Avanç','Incidència','Relleu'].map(t=>`<option ${t===type?'selected':''}>${t}</option>`).join('')}</select></div></div><div class="form-row"><label class="fieldlabel" for="partQty">Peces d’aquest part (0 si només és una nota)</label><input class="mini" id="partQty" type="number" min="0" max="60" step="1" value="0" required></div><div class="form-row"><label class="fieldlabel" for="partNote">Què ha passat? Només informació fictícia</label><textarea id="partNote" maxlength="500" required placeholder="Exemple: falten dues peces per revisar el tallat."></textarea></div><p class="tiny muted">El registre s’afegeix a l’ordre. No envia avisos, no substitueix notes ni tanca fases automàticament.</p><div class="actions" style="justify-content:flex-end"><button class="btn secondary" type="button" onclick="closeModal()">Cancel·lar</button><button class="btn" type="submit">Guardar part de mostra</button></div><div id="partError"></div></form>`)}
function savePart(e){e.preventDefault();let id=$('#partOrder').value,qty=Number($('#partQty').value),note=$('#partNote').value.trim();if(!note||qty<0||!Number.isInteger(qty)||qty>order(id).qty){$('#partError').innerHTML='<div class="status-line red" role="alert">Revisa la nota i la quantitat. Les peces no poden superar el lot.</div>';return}state.parts.unshift({id:'PT-'+String(state.parts.length+1).padStart(3,'0'),order:id,type:$('#partType').value,qty,note,time:'Ara · mostra'});addEvent('Nou part afegit a '+id+'. Historial conservat.');closeModal();render();toast('Part guardat a la demo. No s’ha enviat cap avís.')}
function treatments(){return title('Seguiment entre fases','Tractaments, sense perdre el fil','Previsió, confirmació i recepció no són el mateix. Cada canvi queda separat de qualitat.')+`<div class="metrics">${metric('Tractaments','4','Lots de sèrie · mostra')}${metric('Sense confirmar',state.treatments['TR-041'].status==='Pendent'?1:0,'OF-118 · retorn de mostra','amber')}${metric('Rebuts',Object.values(state.treatments).filter(t=>t.status==='Rebut').length,'Recepció no és conformitat')}${metric('Previsions','1','OF-119 · encara no enviat')}</div>${card('Registre de tractaments','Proveïdors i terminis ficticis · no s’envia cap missatge',`<div class="table-wrap"><table><thead><tr><th>Seguiment</th><th>Lot</th><th>Operació / col·laborador</th><th>Retorn de mostra</th><th>Estat</th><th>Acció</th></tr></thead><tbody>${baseOrders.filter(o=>!o.routeNames).map((o,i)=>{let t=state.treatments[o.treatment];return `<tr><td><strong>${o.treatment}</strong><small>${o.id}</small></td><td>${o.lot}<br><small>${o.qty} peces</small></td><td><strong>Tractament del cas</strong><small>Col·laborador fictici ${i%2?'B':'A'}</small></td><td>${esc(t.return)}</td><td>${pill(t.status,t.status==='Pendent'?'amber':t.status==='Rebut'?'green':'gray')}</td><td><button class="btn secondary small" onclick="treatmentModal('${o.id}')">Revisar</button></td></tr>`}).join('')}</tbody></table></div>`)}<div class="grid equal">${card('OF-118 · confirmació pendent','Del dubte a una següent acció concreta',`<div class="card-body"><div class="event"><span class="dot amber"></span><div><b>Quina data està realment confirmada?</b><p>Al començament de l’exemple, cap. Pots registrar una confirmació fictícia i veure-la al resum.</p></div></div><div class="actions" style="margin-top:17px"><button class="btn" onclick="treatmentModal('OF-118')">Registrar una resposta de mostra</button><button class="btn secondary" onclick="draftRequest()">Preparar consulta</button></div></div>`)}${card('Recepció ≠ conformitat','Cada responsabilitat continua al seu lloc',`<div class="card-body stack"><div class="event"><span class="dot"></span><div><b>Producció</b><p>Revisa el retorn i què implica per a la seqüència. La demo no canvia la ruta.</p></div></div><div class="event"><span class="dot"></span><div><b>Qualitat</b><p>Contrasta el certificat i els controls necessaris. Rebre un lot no el dona per conforme.</p></div></div><button class="mini-link" onclick="openQuality('OF-118')">Veure els controls del lot</button></div>`)}</div>`}
function treatmentModal(id){let o=order(id),t=state.treatments[o.treatment];modal(`${o.treatment} · ${id}`,`<p class="tiny muted">Registra només una resposta inventada. No es contacta amb cap proveïdor.</p><form onsubmit="saveTreatment(event,'${id}')"><div class="split-form"><div><label class="fieldlabel" for="trStatus">Estat del seguiment</label><select id="trStatus">${['Pendent','Previst','Confirmat','Rebut'].map(x=>`<option ${t.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label class="fieldlabel" for="trReturn">Retorn de l’exemple</label><select id="trReturn">${['Sense confirmar','Jornada 1','Jornada 2','Jornada 3','Jornada 4','Jornada 5'].map(x=>`<option ${t.return===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="form-row"><label class="fieldlabel" for="trNote">Nota vinculada al seguiment</label><textarea id="trNote" required maxlength="400">${esc(t.note)}</textarea></div><div class="status-line amber">Confirmar el retorn no confirma l’entrega al client. Marcar rebut no valida qualitat.</div><div id="trError"></div><div class="actions" style="justify-content:flex-end;margin-top:18px"><button class="btn secondary" type="button" onclick="closeModal()">Cancel·lar</button><button class="btn" type="submit">Guardar seguiment de mostra</button></div></form>`)}
function saveTreatment(e,id){e.preventDefault();let s=$('#trStatus').value,r=$('#trReturn').value,n=$('#trNote').value.trim();if((s==='Confirmat'||s==='Rebut')&&r==='Sense confirmar'){$('#trError').innerHTML='<div class="status-line red" role="alert">Una confirmació o recepció necessita una jornada de mostra.</div>';return}state.treatments[order(id).treatment]={status:s,return:r,note:n};addEvent(id+': seguiment de tractament actualitzat a '+s.toLowerCase()+'.');closeModal();render();toast('Seguiment guardat. No s’ha validat ni alliberat el lot.')}
function draftRequest(){modal('Consulta preparada · no s’envia',`<label class="fieldlabel" for="requestText">Text editable de mostra</label><textarea id="requestText" style="min-height:160px">Bon dia,\n\nSobre el lot fictici LH-024 de l’ordre OF-118, ens podeu confirmar l’estat del tractament i la previsió de retorn? Producció necessita contrastar aquesta data abans de revisar la seqüència següent.\n\nGràcies.</textarea><p class="tiny muted">No hi ha destinatari ni connexió al correu. Pots revisar el text aquí, no s’envia res.</p><button class="btn secondary" onclick="closeModal()">Tancar consulta</button>`)}
function openQuality(id){selected=order(id)?.routeNames?'OF-118':id;go('quality')}
function quality(){if(order(selected).routeNames)selected='OF-118';let o=order(selected),q=state.quality[o.id],n=Object.values(q).filter(Boolean).length;return title('Qualitat i traçabilitat','Els documents, vinculats al lot','Revisió documental de mostra. No comprova toleràncies ni certifica la conformitat de les peces.')+`<div class="toolbar"><select id="qualityOrder" aria-label="Lot de qualitat" onchange="selectQuality(this.value)">${baseOrders.filter(x=>!x.routeNames).map(x=>`<option value="${x.id}" ${x.id===selected?'selected':''}>${x.id} · ${x.lot} · ${x.product}</option>`).join('')}</select><span class="subtle-tag">${n} de 3 revisions marcades</span></div><div class="grid equal">${card('Carpeta del lot',`${o.id} · ${o.revision}`,`<div class="card-body"><div class="doc-item"><div class="doc-icon">PDF</div><div><b>Plànol · ${o.revision}</b><small>Fitxa de mostra, sense geometria real</small></div><button class="btn secondary small" onclick="doc('drawing')">Veure fitxa</button></div><div class="doc-item"><div class="doc-icon">PDF</div><div><b>Full de control · ${o.lot}</b><small>Controls sense valors dimensionals reals</small></div><button class="btn secondary small" onclick="doc('dim')">Veure fitxa</button></div><div class="doc-item"><div class="doc-icon">PDF</div><div><b>Certificat · ${o.treatment}</b><small>${o.id==='OF-118'?'Pendent de recepció a l’escenari base':'Registre documental inventat'}</small></div><button class="btn secondary small" onclick="doc('certificate')">Veure fitxa</button></div></div>`)}${card('Revisió humana','Marcar caselles només simula la revisió',`<div class="card-body">${[['drawing','Ordre, lot i revisió de plànol','Comprovar que la revisió correspon al lot.'],['dim','Full de control contrastat','Revisar les dades i els criteris d’acceptació reals.'],['certificate','Certificat de tractament revisat','Comprovar lot, procés i document aplicable.']].map(([k,l,n])=>`<label class="check"><input type="checkbox" ${q[k]?'checked':''} onchange="qualityCheck('${k}',this.checked)"><span><b>${l}</b><small>${n}</small></span></label>`).join('')}<div class="status-line ${n===3?'':'amber'}">${n===3?'Checklist de mostra complet. La conformitat continua sent una decisió de qualitat.':'Falten revisions de mostra. El lot no es considera alliberat.'}</div><div class="actions" style="margin-top:16px"><button class="btn secondary small" onclick="choose('${o.id}')">Tornar a l’ordre</button><button class="btn small" onclick="recordReview()">Guardar revisió de mostra</button></div></div>`)}</div>${card('Traçabilitat del cas','Referències que han de continuar unides',`<div class="facts"><div class="fact"><small>Ordre</small><b>${o.id}</b></div><div class="fact"><small>Lot</small><b>${o.lot}</b></div><div class="fact"><small>Plànol</small><b>${o.revision}</b></div><div class="fact"><small>Tractament</small><b>${o.treatment}</b></div></div><div class="card-body"><p class="tiny muted" style="margin:0">La demo no inclou arxius tècnics, certificats ni valors de procés autèntics. Les fitxes serveixen per mostrar com es podria reunir el context abans de revisar-lo.</p></div>`)}`}
function selectQuality(v){selected=v;render()}function qualityCheck(k,v){state.quality[selected][k]=v;persist();render()}function recordReview(){if(!state.reviewed.includes(selected))state.reviewed.push(selected);addEvent(selected+': revisió documental de mostra guardada, sense alliberament.');toast('Revisió guardada. No és una conformitat de qualitat.')}
function doc(type){let o=order(selected),labels={drawing:'Plànol de referència',dim:'Full de control',certificate:'Certificat de tractament'};modal(labels[type]+' · fitxa fictícia',`<div class="eyebrow">NO ÉS UN DOCUMENT TÈCNIC</div><h2 style="margin:9px 0 20px">${o.id} · ${o.lot}</h2><div class="stack"><div><span class="tiny muted">Producte</span><h3>${o.product}</h3></div><div><span class="tiny muted">Revisió vinculada</span><h3>${o.revision}</h3></div><div><span class="tiny muted">Referència de seguiment</span><h3>${o.treatment}</h3></div></div><div class="status-line amber">${type==='drawing'?'No hi ha geometria, toleràncies ni fitxer CAD. Caldria contrastar la revisió amb l’original.':type==='dim'?'No s’han inventat mesures ni límits d’acceptació. El full real l’ha de revisar qualitat.':'No s’han inventat paràmetres, dureses ni conformitats. Aquesta fitxa no és un certificat.'}</div><button class="btn secondary" style="margin-top:18px" onclick="closeModal()">Tornar a la carpeta del lot</button>`)}
function buildSummary(){let t=state.treatments['TR-041'],q=state.quality['OF-121'];return `RESUM DE PRODUCCIÓ · DEMO AMB DADES FICTÍCIES\n\nCartera de mostra: 6 ordres, 144 unitats entre peces i conjunts. No són dades d’Addendum.\n\nOF-118 · Engranatge helicoidal · lot LH-024\nTallat acabat segons el part d’exemple. Tractament: ${t.status.toLowerCase()}, retorn ${t.return.toLowerCase()}. ${t.note}\nRectificat i control final pendents. No hi ha una entrega nova validada.\n\nOF-119 · Engranatge recte · lot LR-060\nTallat en curs. El registre inicial indica 36 de 60 peces. Els nous parts són anotacions per contrastar, no es sumen automàticament al total.\n\nOF-120 · Eix mecanitzat · lot LE-012\nRectificat en curs en aquest escenari. Control final pendent.\n\nOF-121 · Engranatge cilíndric · lot LC-040\n${q.certificate?'Revisió del certificat marcada a la demo. Qualitat ha de decidir la conformitat real.':'Pendent de revisar el certificat de tractament abans de valorar l’alliberament.'}\n\nOF-122 · Prototip cònic · lot LP-006\n${state.technical.prototype?'Revisió de mostra marcada. La fabricació i l’homologació requereixen dades i aprovacions reals.':'Revisió de disseny pendent abans de preparar el prototip.'}\n\nOF-123 · Conjunt de transmissió · lot LA-002\n${state.technical.assembly?'Comprovació de components marcada a la demo. Muntatge encara per revisar.':'Preparació de muntatge pendent de contrastar components i revisió de conjunt.'}\n\nPARTS DE TALLER\n${state.parts.length} registres de mostra. Últim: ${state.parts[0].order} · ${state.parts[0].type.toLowerCase()}: ${state.parts[0].note}\n\nESCENARI DE TALLER\n${state.scenario?'Simulació +1 jornada al tractament OF-118: proposta de rectificat de J3 a J4. Sense canvi al pla real ni confirmació al client.':'Escenari base, amb proposta condicionada al retorn del tractament. Sense pla aplicat.'}\n\nPROPERES ACCIONS PER REVISAR\n1. Contrastar retorn del tractament OF-118.\n2. Revisar documentació i controls OF-121.\n3. Validar seqüència i recursos reals abans de tocar el pla.\n\nAquest resum es prepara a partir de les dades de mostra de la demo. No executa IA, no llegeix documents i no envia missatges.`}
function summaryPage(){return title('Resum del responsable','Menys reconstruir. Més decidir amb context.','Les ordres, els parts i els pendents de la demo es reuneixen en un text editable. Revisa’l abans de guardar-lo.',`<button class="btn secondary" onclick="regenerate()">Regenerar des de les dades de mostra</button>`)+`<div class="grid">${card('Resum de jornada · editable','Preparat amb els registres actuals d’aquest navegador',`<div class="card-body"><label class="fieldlabel" for="summaryText">Text per revisar · no s’envia</label><textarea class="summary-box" id="summaryText" oninput="editSummary(this.value)">${esc(state.summaryText??buildSummary())}</textarea><div class="actions summary-actions" style="justify-content:space-between;margin-top:16px"><span class="tiny muted">Cap destinatari ni integració de correu.</span><button class="btn" onclick="saveSummary()">Guardar revisió local</button></div>${state.summarySaved?'<div class="status-line" role="status">Revisió guardada en aquest navegador. No s’ha enviat res.</div>':''}</div>`)}${card('Abans de compartir-lo','La informació continua necessitant un responsable',`<div class="card-body stack"><div class="event"><span class="dot amber"></span><div><b>Separar fet de pendent</b><p>Una previsió de retorn no és una confirmació. Un lot rebut no és un lot conforme.</p></div></div><div class="event"><span class="dot"></span><div><b>Contrastar l’origen</b><p>Parts, documents i fases haurien de provenir de fonts validades i amb permisos.</p></div></div><div class="event"><span class="dot"></span><div><b>Decidir amb les dades reals</b><p>No s’apliquen canvis al taller, no es calculen compromisos al client i no s’allibera qualitat.</p></div></div><div class="hr" style="margin:6px 0"></div><p class="tiny muted">En una implantació: primer validar el cas i què cobreixen les eines actuals. Després definir les dades i les integracions necessàries.</p><button class="mini-link" onclick="sources()">Què és públic i què és inventat?</button></div>`)}</div>`}
function editSummary(v){state.summaryText=v;state.summarySaved=false;persist();document.querySelector('#app [role=status]')?.remove()}function regenerate(){state.summaryText=buildSummary();state.summarySaved=false;persist();render();toast('Resum regenerat des dels registres de mostra.')}function saveSummary(){state.summaryText=$('#summaryText').value;state.summarySaved=true;persist();render();toast('Revisió guardada només en aquest navegador.')}

function technical(){return title('Oficina tècnica · preparació de fabricació','No tots els treballs segueixen la mateixa ruta','Sèrie, prototip i conjunt tenen punts de revisió diferents. Aquesta vista és una proposta, no el procés intern d’Addendum.')+`<div class="grid equal">${card('Prototip · OF-122','Engranatge cònic · LP-006 · 6 peces de mostra',`<div class="card-body"><div class="eyebrow">REVISIÓ PC-122 · A</div><h3 style="margin:10px 0">De la revisió al primer lot</h3><p class="tiny muted">La web d’Addendum ofereix prototips i pre-sèries perquè el client pugui provar i homologar components. Aquí es mostra només el seguiment documental d’un prototip fictici.</p><label class="check"><input type="checkbox" ${state.technical.prototype?'checked':''} onchange="technicalCheck('prototype',this.checked)"><span><b>Revisió del prototip contrastada · simulació</b><small>No valida geometria, material, càlcul d’engranatges ni homologació.</small></span></label><div class="status-line ${state.technical.prototype?'':'amber'}">${state.technical.prototype?'Revisió marcada a la mostra. No s’ha creat cap ordre real.':'No preparar la ruta com si la revisió ja estigués aprovada.'}</div><div class="actions" style="margin-top:15px"><button class="btn secondary small" onclick="choose('OF-122')">Obrir ruta de prototip</button><button class="btn secondary small" onclick="revisionModal()">Veure canvi de revisió</button></div></div>`)}${card('Conjunt · OF-123','Conjunt de transmissió · LA-002 · 2 unitats de mostra',`<div class="card-body"><div class="eyebrow">REVISIÓ CT-123 · D</div><h3 style="margin:10px 0">Peces preparades abans del muntatge</h3><p class="tiny muted">Addendum descriu conjunts de transmissió amb Dedendum. La demo proposa reunir les referències i els pendents abans del muntatge, sense atribuir-los una llista de materials real.</p><div class="table-wrap compact"><table><thead><tr><th>Component fictici</th><th>Necessari</th><th>Revisió</th></tr></thead><tbody><tr><td>Engranatge del conjunt</td><td>2 unitats</td><td>${pill('Per contrastar','amber')}</td></tr><tr><td>Eix del conjunt</td><td>2 unitats</td><td>${pill('De mostra','gray')}</td></tr><tr><td>Cos del conjunt</td><td>2 unitats</td><td>${pill('De mostra','gray')}</td></tr></tbody></table></div><label class="check"><input type="checkbox" ${state.technical.assembly?'checked':''} onchange="technicalCheck('assembly',this.checked)"><span><b>Components i revisió contrastats · simulació</b><small>No reserva estoc ni autoritza el muntatge real.</small></span></label><button class="btn secondary small" onclick="choose('OF-123')">Obrir ruta de muntatge</button></div>`)}</div>${card('Una revisió canvia el context','No es pot propagar un plànol nou sense revisar què afecta',`<div class="card-body"><div class="route">${['Revisió vigent','Ordres afectades','Ruta a revisar','Documents vinculats','Responsable'].map((x,i)=>`<div class="phase"><small>0${i+1}</small><b>${x}</b><span>Contrast humà</span></div>`).join('')}</div><p class="tiny muted" style="margin:18px 0 0">No es dissenya cap peça amb IA ni es recomanen materials, tractaments o paràmetres. Aquesta pantalla només mostra el control de context que caldria validar abans de fabricar.</p></div>`)}`}
function technicalCheck(k,v){state.technical[k]=v;addEvent((k==='prototype'?'OF-122':'OF-123')+': comprovació tècnica de mostra '+(v?'marcada.':'desmarcada.'));render();toast('Comprovació local guardada. No és una aprovació tècnica.')}
function revisionModal(){modal('Canvi de revisió · exemple fictici',`<div class="eyebrow">PC-122 · A → B · SUPÒSIT</div><h2 style="margin:10px 0 18px">Abans de fabricar el prototip</h2><p class="tiny muted">Una revisió nova podria afectar el prototip, la ruta i els controls. La demo no calcula aquests canvis.</p><div class="stack"><div class="event"><span class="dot amber"></span><div><b>OF-122 · pendent de revisió tècnica</b><p>Contrastar quina revisió s’ha de fabricar i què ha canviat.</p></div></div><div class="event"><span class="dot"></span><div><b>Documents i controls</b><p>Identificar els documents afectats abans de preparar la fabricació.</p></div></div><div class="event"><span class="dot"></span><div><b>Sense propagació automàtica</b><p>No s’ha substituït cap plànol, programa o ordre.</p></div></div></div><button class="btn secondary" style="margin-top:18px" onclick="closeModal()">Tancar revisió</button>`)}

function sources(){modal('Fonts, dades i límits',`<div class="source-list"><h3>Què hem fet servir d’Addendum?</h3><p>La seva web descriu engranatges cilíndrics, cònics, interiors i especials; disseny a mida, prototips, torneig, fresat, rectificat, tractaments i control de qualitat. També descriu conjunts de transmissió amb Dedendum. Les pantalles segueixen aquestes famílies de processos, no una operativa interna coneguda.</p><a href="https://addendum.es/empresa/?lang=es" target="_blank" rel="noopener">Addendum · empresa</a><a href="https://addendum.es/productos-servicios/fabricacion-en-serie/?lang=es" target="_blank" rel="noopener">Fabricació en sèrie i processos</a><a href="https://addendum.es/productos-servicios/fabricacion-en-serie/engranajes-cilindricos/?lang=es" target="_blank" rel="noopener">Engranatges cilíndrics</a><a href="https://addendum.es/recursos-productivos/?lang=es" target="_blank" rel="noopener">Recursos productius publicats</a><a href="https://addendum.es/products-and-services/prototypes-and-preseries/" target="_blank" rel="noopener">Prototips i pre-sèries</a><a href="https://addendum.es/products-and-services/manufacturing-transmission-sets/" target="_blank" rel="noopener">Conjunts de transmissió / Dedendum</a><a href="https://addendum.es/quality/" target="_blank" rel="noopener">Qualitat i certificacions publicades</a><div class="hr"></div><h3>Què és fictici?</h3><p>Totes les ordres, lots, peces, revisions, quantitats, centres, parts, incidències, documents, col·laboradors i jornades. No s’han copiat dades operatives de cap altra empresa. El logotip és de la web d’Addendum. Maqueta independent, no producte oficial seu.</p><h3>Què no fa?</h3><p>No executa IA ni llegeix fitxers reals. No hi ha connexió a correu, ERP, proveïdors o màquines. No calcula capacitat, toleràncies, costos, estalvis o terminis reals. Les accions només canvien dades locals de la demo. No hi posis informació real.</p><p>Context públic consultat el 18/11/2026. La simulació de càrrega és una comparació il·lustrativa, no un motor de planificació.</p></div>`)}
function resetAsk(){modal('Reiniciar la demo?',`<p>Es recuperaran les sis ordres i els parts ficticis inicials. S’esborraran només les proves que hagis fet en aquest navegador.</p><div class="actions" style="justify-content:flex-end"><button class="btn secondary" onclick="closeModal()">Conservar proves</button><button class="btn" onclick="resetDemo()">Reiniciar dades de mostra</button></div>`)}function resetDemo(){state=defaults();persist();closeModal();page='overview';render();toast('Dades inicials de mostra recuperades.')}
function render(){document.querySelector('.nav').innerHTML=modules.map(([id,name],i)=>`<button class="${page===id||(page==='detail'&&id==='orders')?'active':''}" ${page===id?'aria-current="page"':''} onclick="go('${id}')"><span>0${i+1}</span>${name}</button>`).join('');let f={overview,orders,detail,workshop,parts,treatments,quality,technical,summary:summaryPage};$('#app').innerHTML=f[page]()+foot()}
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
</script></body></html>
