let state;try{state=Object.assign(defaults(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){state=defaults()}let page='overview',selected='OF-118',query='',filter='all';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const persist=()=>localStorage.setItem(KEY,JSON.stringify(state));const order=id=>baseOrders.find(o=>o.id===id);const pill=(text,tone='gray')=>`<span class="badge ${tone}">${esc(text)}</span>`;const progress=n=>`<div class="progress"><i style="width:${n}%"></i></div>`;const phaseNames=['Torneig','Tallat / estriat','Tractament','Rectificat','Control final'];

function assistPart(){modal('De la nota al part · assistència simulada',`<div class="eyebrow">1. ENTRADA DE MOSTRA</div><p style="margin:10px 0 16px">«OF-118, lot LH-024. Tallat acabat. Encara no tenim confirmació del retorn del tractament. Revisar amb producció abans de moure rectificat.»</p><div class="status-line amber">És una nota preparada per a la demo. No s’analitzen missatges reals ni s’executa un model d’IA.</div><button class="btn" style="margin-top:18px" onclick="assistPreview()">Veure proposta de part</button>`)}
function assistPreview(){modal('Proposta de part · pendent de revisió',`<div class="eyebrow">2. CONTEXT REUNIT · 3. REVISIÓ HUMANA</div><div class="facts" style="margin:15px 0"><div class="fact"><small>Ordre detectada a la mostra</small><b>OF-118</b></div><div class="fact"><small>Lot de la mostra</small><b>LH-024</b></div><div class="fact"><small>Fet reportat</small><b>Tallat acabat</b></div><div class="fact"><small>Data de retorn</small><b>No confirmada</b></div></div><p class="tiny muted">El text proposa un pendent, no inventa una data ni canvia la seqüència de màquina.</p><label class="fieldlabel" for="assistNote">Nota proposada · editable</label><textarea id="assistNote">Tallat acabat segons la nota de mostra. Pendent de confirmar el retorn del tractament abans de revisar la proposta de rectificat.</textarea><label class="check"><input type="checkbox" id="assistReviewed" onchange="document.getElementById('assistError').innerHTML=''"><span><b>He revisat el context d’aquest exemple</b><small>No equival a una validació de la realitat de planta.</small></span></label><button class="btn" style="margin-top:15px" onclick="saveAssist()">Afegir proposta revisada a l’historial</button><div id="assistError"></div>`)}
function saveAssist(){if(!$('#assistReviewed').checked||!$('#assistNote').value.trim()){$('#assistError').innerHTML='<div class="status-line red" role="alert">Revisa la nota i marca la comprovació abans de guardar.</div>';return}state.parts.unshift({id:'PT-'+String(state.parts.length+1).padStart(3,'0'),order:'OF-118',type:'Incidència',qty:0,note:$('#assistNote').value.trim(),time:'Ara · proposta revisada'});addEvent('OF-118: proposta de part de mostra revisada i afegida a l’historial.');closeModal();render();toast('Proposta revisada guardada. Sense modificar la ruta ni cap data.')}

function modal(h,body){$('#modal').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(h)}"><div class="card-head"><h2>${h}</h2><button class="close" aria-label="Tancar finestra" onclick="closeModal()">×</button></div><div class="card-body">${body}</div></section></div>`;$('#modal input, #modal select, #modal textarea, #modal button')?.focus()}function closeModal(){$('#modal').innerHTML=''}
function partModal(id,type='Avanç'){modal('Nou part · dades de mostra',`<form onsubmit="savePart(event)"><div class="split-form"><div><label class="fieldlabel" for="partOrder">Ordre de fabricació</label><select id="partOrder">${baseOrders.map(o=>`<option value="${o.id}" ${id===o.id?'selected':''}>${o.id} · ${o.lot}</option>`).join('')}</select></div><div><label class="fieldlabel" for="partType">Tipus de part</label><select id="partType">${['Avanç','Incidència','Relleu'].map(t=>`<option ${t===type?'selected':''}>${t}</option>`).join('')}</select></div></div><div class="form-row"><label class="fieldlabel" for="partQty">Peces d’aquest part (0 si només és una nota)</label><input class="mini" id="partQty" type="number" min="0" max="60" step="1" value="0" required></div><div class="form-row"><label class="fieldlabel" for="partNote">Què ha passat? Només informació fictícia</label><textarea id="partNote" maxlength="500" required placeholder="Exemple: falten dues peces per revisar el tallat."></textarea></div><p class="tiny muted">El registre s’afegeix a l’ordre. No envia avisos, no substitueix notes ni tanca fases automàticament.</p><div class="actions" style="justify-content:flex-end"><button class="btn secondary" type="button" onclick="closeModal()">Cancel·lar</button><button class="btn" type="submit">Guardar part de mostra</button></div><div id="partError"></div></form>`)}
function savePart(e){e.preventDefault();let id=$('#partOrder').value,qty=Number($('#partQty').value),note=$('#partNote').value.trim();if(!note||qty<0||!Number.isInteger(qty)||qty>order(id).qty){$('#partError').innerHTML='<div class="status-line red" role="alert">Revisa la nota i la quantitat. Les peces no poden superar el lot.</div>';return}state.parts.unshift({id:'PT-'+String(state.parts.length+1).padStart(3,'0'),order:id,type:$('#partType').value,qty,note,time:'Ara · mostra'});addEvent('Nou part afegit a '+id+'. Historial conservat.');closeModal();render();toast('Part guardat a la demo. No s’ha enviat cap avís.')}
function treatments(){return title('Seguiment entre fases','Tractaments externs','Previsió, confirmació i recepció no són el mateix. Cada canvi queda separat de qualitat.')+`<div class="metrics">${metric('Tractaments','4','Lots de sèrie · mostra')}${metric('Sense confirmar',Object.values(state.treatments).filter(t=>t.status==='Pendent').length,'Retorns pendents de mostra','amber')}${metric('Rebuts',Object.values(state.treatments).filter(t=>t.status==='Rebut').length,'Recepció no és conformitat')}${metric('Previsions',Object.values(state.treatments).filter(t=>t.status==='Previst').length,'Encara pendents de confirmar')}</div>${card('Registre de tractaments','Proveïdors i terminis ficticis · no s’envia cap missatge',`<div class="table-wrap"><table><thead><tr><th>Seguiment</th><th>Lot</th><th>Operació / col·laborador</th><th>Retorn de mostra</th><th>Estat</th><th>Acció</th></tr></thead><tbody>${baseOrders.filter(o=>!o.routeNames).map((o,i)=>{let t=state.treatments[o.treatment];return `<tr><td><strong>${o.treatment}</strong><small>${o.id}</small></td><td>${o.lot}<br><small>${o.qty} peces</small></td><td><strong>Tractament del cas</strong><small>Col·laborador fictici ${i%2?'B':'A'}</small></td><td>${esc(t.return)}</td><td>${pill(t.status,t.status==='Pendent'?'amber':t.status==='Rebut'?'green':'gray')}</td><td><button class="btn secondary small" onclick="treatmentModal('${o.id}')">Revisar</button></td></tr>`}).join('')}</tbody></table></div><div class="table-hint">Llisca la taula per veure totes les columnes →</div>`)}<div class="grid equal">${card('OF-118 · confirmació pendent','Del dubte a una següent acció concreta',`<div class="card-body"><div class="event"><span class="dot amber"></span><div><b>Quina data està realment confirmada?</b><p>Al començament de l’exemple, cap. Pots registrar una confirmació fictícia i veure-la al resum.</p></div></div><div class="actions" style="margin-top:17px"><button class="btn" onclick="treatmentModal('OF-118')">Registrar una resposta de mostra</button><button class="btn secondary" onclick="draftRequest()">Preparar consulta</button></div></div>`)}${card('Recepció ≠ conformitat','Cada responsabilitat continua al seu lloc',`<div class="card-body stack"><div class="event"><span class="dot"></span><div><b>Producció</b><p>Revisa el retorn i què implica per a la seqüència. La demo no canvia la ruta.</p></div></div><div class="event"><span class="dot"></span><div><b>Qualitat</b><p>Contrasta el certificat i els controls necessaris. Rebre un lot no el dona per conforme.</p></div></div><button class="mini-link" onclick="openQuality('OF-118')">Veure els controls del lot</button></div>`)}</div>`}
function treatmentModal(id){let o=order(id),t=state.treatments[o.treatment];modal(`${o.treatment} · ${id}`,`<p class="tiny muted">Registra només una resposta inventada. No es contacta amb cap proveïdor.</p><form onsubmit="saveTreatment(event,'${id}')"><div class="split-form"><div><label class="fieldlabel" for="trStatus">Estat del seguiment</label><select id="trStatus">${['Pendent','Previst','Confirmat','Rebut'].map(x=>`<option ${t.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label class="fieldlabel" for="trReturn">Retorn de l’exemple</label><select id="trReturn">${['Sense confirmar','Jornada 1','Jornada 2','Jornada 3','Jornada 4','Jornada 5'].map(x=>`<option ${t.return===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="form-row"><label class="fieldlabel" for="trNote">Nota vinculada al seguiment</label><textarea id="trNote" required maxlength="400">${esc(t.note)}</textarea></div><div class="status-line amber">Confirmar el retorn no confirma l’entrega al client. Marcar rebut no valida qualitat.</div><div id="trError"></div><div class="actions" style="justify-content:flex-end;margin-top:18px"><button class="btn secondary" type="button" onclick="closeModal()">Cancel·lar</button><button class="btn" type="submit">Guardar seguiment de mostra</button></div></form>`)}
function saveTreatment(e,id){e.preventDefault();let s=$('#trStatus').value,r=$('#trReturn').value,n=$('#trNote').value.trim();if((s==='Confirmat'||s==='Rebut')&&r==='Sense confirmar'){$('#trError').innerHTML='<div class="status-line red" role="alert">Una confirmació o recepció necessita una jornada de mostra.</div>';return}state.treatments[order(id).treatment]={status:s,return:r,note:n};addEvent(id+': seguiment de tractament actualitzat a '+s.toLowerCase()+'.');closeModal();render();toast('Seguiment guardat. No s’ha validat ni alliberat el lot.')}
function draftRequest(){modal('Consulta preparada · no s’envia',`<label class="fieldlabel" for="requestText">Text editable de mostra</label><textarea id="requestText" style="min-height:160px">Bon dia,\n\nSobre el lot fictici LH-024 de l’ordre OF-118, ens podeu confirmar l’estat del tractament i la previsió de retorn? Producció necessita contrastar aquesta data abans de revisar la seqüència següent.\n\nGràcies.</textarea><p class="tiny muted">No hi ha destinatari ni connexió al correu. Pots revisar el text aquí, no s’envia res.</p><button class="btn secondary" onclick="closeModal()">Tancar consulta</button>`)}
function openQuality(id){selected=order(id)?.routeNames?'OF-118':id;go('quality')}
function quality(){if(order(selected).routeNames)selected='OF-118';let o=order(selected),q=state.quality[o.id],n=Object.values(q).filter(Boolean).length;return title('Qualitat i traçabilitat','Control documental','Revisió documental de mostra. No comprova toleràncies ni certifica la conformitat de les peces.')+`<div class="toolbar"><select id="qualityOrder" aria-label="Lot de qualitat" onchange="selectQuality(this.value)">${baseOrders.filter(x=>!x.routeNames).map(x=>`<option value="${x.id}" ${x.id===selected?'selected':''}>${x.id} · ${x.lot} · ${x.product}</option>`).join('')}</select><span class="subtle-tag">${n} de 3 revisions marcades</span></div><div class="grid equal">${card('Carpeta del lot',`${o.id} · ${o.revision}`,`<div class="card-body"><div class="doc-item"><div class="doc-icon">PDF</div><div><b>Plànol · ${o.revision}</b><small>Fitxa de mostra, sense geometria real</small></div><button class="btn secondary small" onclick="doc('drawing')">Veure fitxa</button></div><div class="doc-item"><div class="doc-icon">PDF</div><div><b>Full de control · ${o.lot}</b><small>Controls sense valors dimensionals reals</small></div><button class="btn secondary small" onclick="doc('dim')">Veure fitxa</button></div><div class="doc-item"><div class="doc-icon">PDF</div><div><b>Certificat · ${o.treatment}</b><small>${o.id==='OF-118'?'Pendent de recepció a l’escenari base':'Registre documental inventat'}</small></div><button class="btn secondary small" onclick="doc('certificate')">Veure fitxa</button></div></div>`)}${card('Revisió humana','Marcar caselles només simula la revisió',`<div class="card-body">${[['drawing','Ordre, lot i revisió de plànol','Comprovar que la revisió correspon al lot.'],['dim','Full de control contrastat','Revisar les dades i els criteris d’acceptació reals.'],['certificate','Certificat de tractament revisat','Comprovar lot, procés i document aplicable.']].map(([k,l,n])=>`<label class="check"><input type="checkbox" ${q[k]?'checked':''} onchange="qualityCheck('${k}',this.checked)"><span><b>${l}</b><small>${n}</small></span></label>`).join('')}<div class="status-line ${n===3?'':'amber'}">${n===3?'Checklist de mostra complet. La conformitat continua sent una decisió de qualitat.':'Falten revisions de mostra. El lot no es considera alliberat.'}</div><div class="actions" style="margin-top:16px"><button class="btn secondary small" onclick="choose('${o.id}')">Tornar a l’ordre</button><button class="btn small" onclick="recordReview()">Guardar revisió de mostra</button></div></div>`)}</div>${card('Traçabilitat del cas','Referències que han de continuar unides',`<div class="facts"><div class="fact"><small>Ordre</small><b>${o.id}</b></div><div class="fact"><small>Lot</small><b>${o.lot}</b></div><div class="fact"><small>Plànol</small><b>${o.revision}</b></div><div class="fact"><small>Tractament</small><b>${o.treatment}</b></div></div><div class="card-body"><p class="tiny muted" style="margin:0">La demo no inclou arxius tècnics, certificats ni valors de procés autèntics. Les fitxes serveixen per mostrar com es podria reunir el context abans de revisar-lo.</p></div>`)}`}
function selectQuality(v){selected=v;render()}function qualityCheck(k,v){state.quality[selected][k]=v;persist();render()}function recordReview(){if(!state.reviewed.includes(selected))state.reviewed.push(selected);addEvent(selected+': revisió documental de mostra guardada, sense alliberament.');toast('Revisió guardada. No és una conformitat de qualitat.')}
function doc(type){let o=order(selected),labels={drawing:'Plànol de referència',dim:'Full de control',certificate:'Certificat de tractament'};modal(labels[type]+' · fitxa fictícia',`<div class="eyebrow">NO ÉS UN DOCUMENT TÈCNIC</div><h2 style="margin:9px 0 20px">${o.id} · ${o.lot}</h2><div class="stack"><div><span class="tiny muted">Producte</span><h3>${o.product}</h3></div><div><span class="tiny muted">Revisió vinculada</span><h3>${o.revision}</h3></div><div><span class="tiny muted">Referència de seguiment</span><h3>${o.treatment}</h3></div></div><div class="status-line amber">${type==='drawing'?'No hi ha geometria, toleràncies ni fitxer CAD. Caldria contrastar la revisió amb l’original.':type==='dim'?'No s’han inventat mesures ni límits d’acceptació. El full real l’ha de revisar qualitat.':'No s’han inventat paràmetres, dureses ni conformitats. Aquesta fitxa no és un certificat.'}</div><button class="btn secondary" style="margin-top:18px" onclick="closeModal()">Tornar a la carpeta del lot</button>`)}
function buildSummary(){let t=state.treatments['TR-041'],q=state.quality['OF-121'];return `RESUM DE PRODUCCIÓ · DEMO AMB DADES FICTÍCIES\n\nCartera de mostra: 6 ordres, 144 unitats entre peces i conjunts. No són dades d’Addendum.\n\nOF-118 · Engranatge helicoidal · lot LH-024\nTallat acabat segons el part d’exemple. Tractament: ${t.status.toLowerCase()}, retorn ${t.return.toLowerCase()}. ${t.note}\nRectificat i control final pendents. No hi ha una entrega nova validada.\n\nOF-119 · Engranatge recte · lot LR-060\nTallat en curs. El registre inicial indica 36 de 60 peces. Els nous parts són anotacions per contrastar, no es sumen automàticament al total.\n\nOF-120 · Eix mecanitzat · lot LE-012\nRectificat en curs en aquest escenari. Control final pendent.\n\nOF-121 · Engranatge cilíndric · lot LC-040\n${q.certificate?'Revisió del certificat marcada a la demo. Qualitat ha de decidir la conformitat real.':'Pendent de revisar el certificat de tractament abans de valorar l’alliberament.'}\n\nOF-122 · Prototip cònic · lot LP-006\n${state.technical.prototype?'Revisió de mostra marcada. La fabricació i l’homologació requereixen dades i aprovacions reals.':'Revisió de disseny pendent abans de preparar el prototip.'}\n\nOF-123 · Conjunt de transmissió · lot LA-002\n${state.technical.assembly?'Comprovació de components marcada a la demo. Muntatge encara per revisar.':'Preparació de muntatge pendent de contrastar components i revisió de conjunt.'}\n\nOPERACIONS REGISTRADES\n${Object.entries(state.operations).map(([id,op])=>id+': '+op.good+' processades, '+op.reject+' a revisar. Estat: '+op.status).join('\n')}\n\nPARTS DE TALLER\n${state.parts.length} registres de mostra. Últim: ${state.parts[0].order} · ${state.parts[0].type.toLowerCase()}: ${state.parts[0].note}\n\nESCENARI DE TALLER\n${state.scenario?'Simulació +1 jornada al tractament OF-118: proposta de rectificat de J3 a J4. Sense canvi al pla real ni confirmació al client.':'Escenari base, amb proposta condicionada al retorn del tractament. Sense pla aplicat.'}\n\nCANVIS LOCALS DE LA DEMO\n${state.events.length?state.events.slice(0,6).map(e=>'· '+e.text).join('\n'):'Encara no hi ha canvis afegits.'}\n\nPROPERES ACCIONS PER REVISAR\n1. Contrastar retorn del tractament OF-118.\n2. Revisar documentació i controls OF-121.\n3. Validar seqüència i recursos reals abans de tocar el pla.\n\nAquest resum es prepara a partir de les dades de mostra de la demo. No executa IA, no llegeix documents i no envia missatges.`}
function summaryPage(){return title('Resum del responsable','Informe de producció','Les ordres, els parts i els pendents de la demo es reuneixen en un text editable. Revisa’l abans de guardar-lo.',`<button class="btn secondary" onclick="regenerate()">Regenerar des de les dades de mostra</button>`)+`<div class="grid">${card('Resum de jornada · editable','Preparat amb els registres actuals d’aquest navegador',`<div class="card-body"><label class="fieldlabel" for="summaryText">Text per revisar · no s’envia</label><textarea class="summary-box" id="summaryText" oninput="editSummary(this.value)">${esc(state.summaryText??buildSummary())}</textarea><div class="actions summary-actions" style="justify-content:space-between;margin-top:16px"><span class="tiny muted">Cap destinatari ni integració de correu.</span><button class="btn" onclick="saveSummary()">Guardar revisió local</button></div>${state.summarySaved?'<div class="status-line" role="status">Revisió guardada en aquest navegador. No s’ha enviat res.</div>':''}</div>`)}${card('Abans de compartir-lo','La informació continua necessitant un responsable',`<div class="card-body stack"><div class="event"><span class="dot amber"></span><div><b>Separar fet de pendent</b><p>Una previsió de retorn no és una confirmació. Un lot rebut no és un lot conforme.</p></div></div><div class="event"><span class="dot"></span><div><b>Contrastar l’origen</b><p>Parts, documents i fases haurien de provenir de fonts validades i amb permisos.</p></div></div><div class="event"><span class="dot"></span><div><b>Decidir amb les dades reals</b><p>No s’apliquen canvis al taller, no es calculen compromisos al client i no s’allibera qualitat.</p></div></div><div class="hr" style="margin:6px 0"></div><p class="tiny muted">En una implantació: primer validar el cas i què cobreixen les eines actuals. Després definir les dades i les integracions necessàries.</p><button class="mini-link" onclick="sources()">Què és públic i què és inventat?</button></div>`)}</div>`}
function editSummary(v){state.summaryText=v;state.summarySaved=false;persist();document.querySelector('#app [role=status]')?.remove()}function regenerate(){state.summaryText=buildSummary();state.summarySaved=false;persist();render();toast('Resum regenerat des dels registres de mostra.')}function saveSummary(){state.summaryText=$('#summaryText').value;state.summarySaved=true;persist();render();toast('Revisió guardada només en aquest navegador.')}

function technical(){return title('Oficina tècnica · preparació de fabricació','Preparació tècnica','Sèrie, prototip i conjunt tenen punts de revisió diferents. Aquesta vista és una proposta, no el procés intern d’Addendum.')+`<div class="grid equal">${card('Prototip · OF-122','Engranatge cònic · LP-006 · 6 peces de mostra',`<div class="card-body"><div class="eyebrow">REVISIÓ PC-122 · A</div><h3 style="margin:10px 0">De la revisió al primer lot</h3><p class="tiny muted">La web d’Addendum ofereix prototips i pre-sèries perquè el client pugui provar i homologar components. Aquí es mostra només el seguiment documental d’un prototip fictici.</p><label class="check"><input type="checkbox" ${state.technical.prototype?'checked':''} onchange="technicalCheck('prototype',this.checked)"><span><b>Revisió del prototip contrastada · simulació</b><small>No valida geometria, material, càlcul d’engranatges ni homologació.</small></span></label><div class="status-line ${state.technical.prototype?'':'amber'}">${state.technical.prototype?'Revisió marcada a la mostra. No s’ha creat cap ordre real.':'No preparar la ruta com si la revisió ja estigués aprovada.'}</div><div class="actions" style="margin-top:15px"><button class="btn secondary small" onclick="choose('OF-122')">Obrir ruta de prototip</button><button class="btn secondary small" onclick="revisionModal()">Veure canvi de revisió</button></div></div>`)}${card('Conjunt · OF-123','Conjunt de transmissió · LA-002 · 2 unitats de mostra',`<div class="card-body"><div class="eyebrow">REVISIÓ CT-123 · D</div><h3 style="margin:10px 0">Peces preparades abans del muntatge</h3><p class="tiny muted">Addendum descriu conjunts de transmissió amb Dedendum. La demo proposa reunir les referències i els pendents abans del muntatge, sense atribuir-los una llista de materials real.</p><div class="table-wrap compact"><table><thead><tr><th>Component fictici</th><th>Necessari</th><th>Revisió</th></tr></thead><tbody><tr><td>Engranatge del conjunt</td><td>2 unitats</td><td>${pill('Per contrastar','amber')}</td></tr><tr><td>Eix del conjunt</td><td>2 unitats</td><td>${pill('De mostra','gray')}</td></tr><tr><td>Cos del conjunt</td><td>2 unitats</td><td>${pill('De mostra','gray')}</td></tr></tbody></table></div><div class="table-hint">Llisca la taula per veure totes les columnes →</div><label class="check"><input type="checkbox" ${state.technical.assembly?'checked':''} onchange="technicalCheck('assembly',this.checked)"><span><b>Components i revisió contrastats · simulació</b><small>No reserva estoc ni autoritza el muntatge real.</small></span></label><button class="btn secondary small" onclick="choose('OF-123')">Obrir ruta de muntatge</button></div>`)}</div>${card('Una revisió canvia el context','No es pot propagar un plànol nou sense revisar què afecta',`<div class="card-body"><div class="route">${['Revisió vigent','Ordres afectades','Ruta a revisar','Documents vinculats','Responsable'].map((x,i)=>`<div class="phase"><small>0${i+1}</small><b>${x}</b><span>Contrast humà</span></div>`).join('')}</div><p class="tiny muted" style="margin:18px 0 0">No es dissenya cap peça amb IA ni es recomanen materials, tractaments o paràmetres. Aquesta pantalla només mostra el control de context que caldria validar abans de fabricar.</p></div>`)}`}
function technicalCheck(k,v){state.technical[k]=v;addEvent((k==='prototype'?'OF-122':'OF-123')+': comprovació tècnica de mostra '+(v?'marcada.':'desmarcada.'));render();toast('Comprovació local guardada. No és una aprovació tècnica.')}
function revisionModal(){modal('Canvi de revisió · exemple fictici',`<div class="eyebrow">PC-122 · A → B · SUPÒSIT</div><h2 style="margin:10px 0 18px">Abans de fabricar el prototip</h2><p class="tiny muted">Una revisió nova podria afectar el prototip, la ruta i els controls. La demo no calcula aquests canvis.</p><div class="stack"><div class="event"><span class="dot amber"></span><div><b>OF-122 · pendent de revisió tècnica</b><p>Contrastar quina revisió s’ha de fabricar i què ha canviat.</p></div></div><div class="event"><span class="dot"></span><div><b>Documents i controls</b><p>Identificar els documents afectats abans de preparar la fabricació.</p></div></div><div class="event"><span class="dot"></span><div><b>Sense propagació automàtica</b><p>No s’ha substituït cap plànol, programa o ordre.</p></div></div></div><button class="btn secondary" style="margin-top:18px" onclick="closeModal()">Tancar revisió</button>`)}


function operations(){return title('Terminal de taller · entorn de demostració','Operacions de taller','Registre per operació i lot. Els botons controlen només l’estat local de la demo, mai una màquina.')+`<div class="grid equal">${['OF-119','OF-120'].map(id=>{let o=order(id),op=state.operations[id],remaining=o.qty-op.good-op.reject;return `<section class="operation-card"><div class="op-head"><div><div class="eyebrow">${o.stage}</div><h2 style="margin-top:6px">${o.product}</h2><div class="op-ref">${id} / ${o.lot} / ${o.revision}</div></div>${pill(op.status,op.status==='En curs'?'green':op.status==='Pausada'?'amber':'gray')}</div><div class="op-stats"><div><small>PECES REGISTRADES</small><b>${op.good}</b><span class="op-unit"> / ${o.qty}</span></div><div><small>A REVISAR</small><b>${op.reject}</b></div><div><small>PENDENTS</small><b>${remaining}</b></div></div>${progress(Math.round((op.good+op.reject)/o.qty*100))}<div class="op-actions" style="margin-top:20px"><button class="btn ${op.status==='En curs'?'secondary':''}" onclick="setOperation('${id}','${op.status==='En curs'?'Pausada':'En curs'}')">${op.status==='En curs'?'Pausar registre':'Iniciar registre'}</button><button class="btn secondary" onclick="outputModal('${id}')" ${op.status!=='En curs'||remaining<=0?'disabled':''}>Registrar peces</button><button class="btn secondary" onclick="partModal('${id}','Incidència')">Incidència</button></div><div class="tiny muted" style="margin-top:16px">${remaining===0?'Quantitat de mostra registrada. La fase no es tanca ni qualitat s’allibera automàticament.':'Una entrada només suma al registre d’aquesta operació. No reserva ni consumeix material.'}</div><div class="hr" style="margin:16px 0"></div><div class="stack">${op.log.slice(0,4).map(l=>`<div class="event"><span class="dot"></span><div><b>${esc(l)}</b><p>Traça local de la demo</p></div></div>`).join('')||'<span class="tiny muted">Encara no hi ha accions noves en aquesta operació.</span>'}</div></section>`}).join('')}</div>${card('Regles del registre','Comportament de la demo, no instruccions de fabricació',`<div class="card-body"><div class="route"><div class="phase"><small>01</small><b>Operació iniciada</b><span>Registre habilitat</span></div><div class="phase"><small>02</small><b>Quantitat positiva</b><span>Sense superar lot</span></div><div class="phase"><small>03</small><b>Separar revisió</b><span>No és un rebuig final</span></div><div class="phase"><small>04</small><b>Traça acumulativa</b><span>No substitueix parts</span></div><div class="phase"><small>05</small><b>Revisió humana</b><span>Sense alliberament</span></div></div></div>`)}`}
function setOperation(id,status){let op=state.operations[id];op.status=status;op.log.unshift(status==='En curs'?'Registre d’operació iniciat':'Registre d’operació pausat');addEvent(id+': '+op.log[0].toLowerCase()+'.');render();toast('Estat local actualitzat. Cap ordre enviada a màquina.')}
function outputModal(id){let o=order(id),op=state.operations[id];if(op.status!=='En curs')return;modal('Registrar peces · '+id,`<form onsubmit="saveOutput(event,'${id}')"><p class="tiny muted">Lot ${o.lot}. Resten ${o.qty-op.good-op.reject} peces per registrar a l’operació de mostra.</p><div class="split-form"><div><label class="fieldlabel" for="outGood">Peces processades</label><input id="outGood" type="number" min="0" step="1" value="0" required></div><div><label class="fieldlabel" for="outReview">Peces a revisar</label><input id="outReview" type="number" min="0" step="1" value="0" required></div></div><label class="fieldlabel" for="outNote">Nota del registre (obligatòria si hi ha peces a revisar)</label><textarea id="outNote" maxlength="400" placeholder="Només informació fictícia"></textarea><p class="tiny muted">Les dues quantitats són separades. No es declara conformitat ni es tanca la fase.</p><div class="actions" style="justify-content:flex-end"><button class="btn secondary" type="button" onclick="closeModal()">Cancel·lar</button><button class="btn" type="submit">Guardar quantitats de mostra</button></div><div id="outError"></div></form>`)}
function saveOutput(e,id){e.preventDefault();let o=order(id),op=state.operations[id],g=Number($('#outGood').value),r=Number($('#outReview').value),note=$('#outNote').value.trim();if(op.status!=='En curs'||!Number.isInteger(g)||!Number.isInteger(r)||g<0||r<0||g+r<=0||g+r>o.qty-op.good-op.reject||(r>0&&!note)){$('#outError').innerHTML='<div class="status-line red" role="alert">Revisa quantitats i nota: suma positiva, sense superar les peces pendents; les peces a revisar necessiten un motiu.</div>';return}op.good+=g;op.reject+=r;op.log.unshift(g+' processades · '+r+' a revisar'+(note?' · '+note:''));state.parts.unshift({id:'PT-'+String(state.parts.length+1).padStart(3,'0'),order:id,type:r?'Incidència':'Avanç',qty:g+r,note:'Registre d’operació: '+g+' peces processades, '+r+' a revisar. '+note,time:'Ara · mostra'});addEvent(id+': '+g+' peces processades i '+r+' a revisar registrades a la demo.');closeModal();render();toast('Registre acumulat. No s’ha alliberat qualitat ni tancat l’ordre.')}

function sources(){modal('Fonts, dades i límits',`<div class="source-list"><h3>Què hem fet servir d’Addendum?</h3><p>La seva web descriu engranatges cilíndrics, cònics, interiors i especials; disseny a mida, prototips, torneig, fresat, rectificat, tractaments i control de qualitat. També descriu conjunts de transmissió amb Dedendum. Les pantalles segueixen aquestes famílies de processos, no una operativa interna coneguda.</p><a href="https://addendum.es/empresa/?lang=es" target="_blank" rel="noopener">Addendum · empresa</a><a href="https://addendum.es/productos-servicios/fabricacion-en-serie/?lang=es" target="_blank" rel="noopener">Fabricació en sèrie i processos</a><a href="https://addendum.es/productos-servicios/fabricacion-en-serie/engranajes-cilindricos/?lang=es" target="_blank" rel="noopener">Engranatges cilíndrics</a><a href="https://addendum.es/recursos-productivos/?lang=es" target="_blank" rel="noopener">Recursos productius publicats</a><a href="https://addendum.es/products-and-services/prototypes-and-preseries/" target="_blank" rel="noopener">Prototips i pre-sèries</a><a href="https://addendum.es/products-and-services/manufacturing-transmission-sets/" target="_blank" rel="noopener">Conjunts de transmissió / Dedendum</a><a href="https://addendum.es/quality/" target="_blank" rel="noopener">Qualitat i certificacions publicades</a><div class="hr"></div><h3>Què és fictici?</h3><p>Totes les ordres, lots, peces, revisions, quantitats, centres, parts, incidències, documents, col·laboradors i jornades. No s’han copiat dades operatives de cap altra empresa. El logotip és de la web d’Addendum. Maqueta independent, no producte oficial seu.</p><h3>Què no fa?</h3><p>No executa IA ni llegeix fitxers reals. No hi ha connexió a correu, ERP, proveïdors o màquines. Calcula una seqüència finita només amb durades i recursos inventats. No calcula capacitat real, toleràncies, costos, estalvis o terminis reals. Les accions només canvien dades locals de la demo. No hi posis informació real.</p><p>Context públic consultat el 18/11/2026. La seqüència usa 8 h per jornada, un recurs per centre i prioritat per ordre de cartera. No és una optimització ni un pla aplicable a la planta.</p></div>`)}

function sampleCenter(label){return /tractament/i.test(label)?'Tractament':/control|verificaci/i.test(label)?'Control':/rectificat/i.test(label)?'Rectificat':/tallat|dentat|estriat/i.test(label)?'Dentat':/torneig/i.test(label)?'Torneig':/muntatge/i.test(label)?'Muntatge':/fresat/i.test(label)?'Fresat':/embalatge|entrega/i.test(label)?'Preparació sortida':/acabat/i.test(label)?'Acabats':'Preparació tècnica'}
function sampleHours(o,i){return [1,2,1,2,1][i]+(baseOrders.indexOf(o)%3)}
function allUnits(){return baseOrders.reduce((n,o)=>n+o.qty,0)}
function materialRows(o){let i=baseOrders.indexOf(o);return o.id==='OF-123'?[{ref:'CMP-01',name:'Engranatge de conjunt',need:2,available:2},{ref:'CMP-02',name:'Eix de conjunt',need:2,available:1},{ref:'CMP-03',name:'Cos de conjunt',need:2,available:2}]:[{ref:'SEM-'+(301+i),name:'Semielaborat de '+o.product.toLowerCase(),need:o.qty,available:o.id==='OF-126'&&!state.v4.materialReceived[o.id]?64:o.qty}]}

const oldDetail=detail;detail=function(){let o=order(selected);return title('Ordre / lot / ruta',o.id+' · '+o.product,`${o.family} · ${o.lot} · ${o.revision}`,`<button class="btn secondary" onclick="go('orders')">Tornar a cartera</button><button class="btn" onclick="partModal('${o.id}')">Nou part</button>`)+`<div class="metrics">${metric('Quantitat',o.qty,'Unitats del lot de mostra')}${metric('Fases completades',o.route.filter(x=>x===1).length+'/5','No equival a conformitat')}${metric('Material',materialReady(o)?'Complet':'Pendent',o.materialLot,materialReady(o)?'':'amber')}${metric('Jornada objectiu','J'+o.due,'Objectiu fictici, no compromís')}</div>`+card('Full de ruta detallat','Temps, centres i dependències de mostra, no instruccions tècniques',`<div class="table-wrap"><table><thead><tr><th>OP</th><th>Operació</th><th>Centre de mostra</th><th>Predecessora</th><th>Preparació</th><th>Temps total de mostra</th><th>Estat</th></tr></thead><tbody>${(o.routeNames||phaseNames).map((p,i)=>`<tr><td>OP${(i+1)*10}</td><td><strong>${p}</strong></td><td>${sampleCenter(p)} · genèric</td><td>${i?'OP'+i*10:'Material i revisió'}</td><td>Inclosa</td><td>${sampleHours(o,i)} h</td><td>${pill(o.route[i]===1?'Acabada':o.route[i]===2?'Punt de seguiment':'Pendent',o.route[i]===1?'green':o.route[i]===2?'amber':'gray')}</td></tr>`).join('')}</tbody></table></div><div class="table-hint">Llisca per veure totes les columnes →</div>`)+`<div class="grid equal">${card('Material i revisions','Condicions abans de preparar la fase',`<div class="card-body"><h3>${o.materialLot} · ${o.revision}</h3>${materialRows(o).map(x=>`<p class="tiny">${x.ref} · necessari ${x.need}, disponible ${x.available}</p>`).join('')}<div class="actions"><button class="btn secondary small" onclick="selected='${o.id}';go('materials')">Veure necessitats</button><button class="btn secondary small" onclick="newChange('${o.id}')">Proposar canvi de revisió</button></div></div>`)}${card('Bloquejos i traça','Les revisions continuen sent humanes',`<div class="card-body stack">${state.v4.ncs.filter(n=>n.order===o.id).map(n=>`<div class="event"><span class="dot amber"></span><div><b>${n.id} · ${n.status}</b><p>${esc(n.reason)}</p></div></div>`).join('')||'<p class="tiny muted">Sense no-conformitats registrades per aquest lot a la demo.</p>'}<button class="btn secondary small" onclick="newNC('${o.id}')">Obrir no-conformitat de mostra</button><button class="btn secondary small" onclick="go('dispatch')">Preparació d’expedició</button></div>`)}</div>`+card('Parts de l’ordre','Historial acumulatiu',`<div class="card-body stack">${state.parts.filter(p=>p.order===o.id).map(p=>`<div class="event"><span class="dot"></span><div><b>${p.id} · ${p.type}</b><p>${esc(p.note)}</p></div><time>${esc(p.time)}</time></div>`).join('')||'<span class="tiny muted">Sense parts en aquest lot.</span>'}</div>`)};
function materials(){let o=order(selected);return title('Materials / necessitats','Disponibilitat per ordre','Necessitats fictícies en unitats de semielaborat o component. Cap compra, reserva ni consum real.')+`<div class="toolbar"><select aria-label="Ordre de material" onchange="selected=this.value;render()">${baseOrders.map(x=>`<option value="${x.id}" ${selected===x.id?'selected':''}>${x.id} · ${x.product}</option>`).join('')}</select></div>`+card('Necessitats · '+o.id,`${o.materialLot} · lot de mostra`, `<div class="table-wrap"><table><thead><tr><th>Referència</th><th>Element</th><th>Necessari</th><th>Disponible</th><th>Manca</th></tr></thead><tbody>${materialRows(o).map(r=>`<tr><td>${r.ref}</td><td>${r.name}</td><td>${r.need}</td><td>${r.available}</td><td>${pill(Math.max(0,r.need-r.available),r.available<r.need?'amber':'green')}</td></tr>`).join('')}</tbody></table></div><div class="card-body"><div class="actions"><button class="btn secondary" onclick="choose('${o.id}')">Obrir ordre</button>${o.id==='OF-126'&&!materialReady(o)?'<button class="btn" onclick="receiveMaterial()">Registrar recepció fictícia de 16 unitats</button>':''}</div><div class="status-line ${materialReady(o)?'':'amber'}">${materialReady(o)?'Necessitat coberta en la mostra. No equival a material homologat ni reservat.':'Manca material en la mostra. La càrrega no es pot considerar preparada.'}</div></div>`)+card('Vista de necessitats de cartera','Selecciona OF-126 per provar recepció i desbloqueig de disponibilitat',`<div class="table-wrap"><table><thead><tr><th>Ordre</th><th>Lot material</th><th>Necessitat</th><th>Disponibilitat</th><th></th></tr></thead><tbody>${baseOrders.map(x=>`<tr><td>${x.id}</td><td>${x.materialLot}</td><td>${x.qty} unitats</td><td>${pill(materialReady(x)?'Coberta':'Incompleta',materialReady(x)?'green':'amber')}</td><td><button class="row-button" onclick="selected='${x.id}';render()">Revisar</button></td></tr>`).join('')}</tbody></table></div><div class="table-hint">Llisca per veure totes les columnes →</div>`)}
function receiveMaterial(){state.v4.materialReceived['OF-126']=true;addEvent('OF-126: recepció fictícia de 16 semielaborats registrada. Disponibilitat completa, sense homologació.');render();toast('Recepció local registrada. No s’ha comprat ni reservat res.')}
function calculatedPlan(extra=0){let availability={},items=[];for(let o of baseOrders){let start=0;for(let i=0;i<5;i++){if(o.route[i]===1)continue;let resource=(o.routeNames||phaseNames)[i];let center=sampleCenter(resource);let duration=sampleHours(o,i);let ready=Math.max(start,availability[center]||0);if(o.id==='OF-118'&&i===2)ready=Math.max(ready,8+extra*8);if(!materialReady(o))ready=Math.max(ready,24);let finish=ready+duration;availability[center]=finish;items.push({order:o.id,op:'OP'+(i+1)*10,name:resource,center,start:ready,finish,duration,late:finish>o.due*8,material:materialReady(o)});start=finish}}return {items,availability,end:Math.max(...items.map(x=>x.finish))}}
workshop=function(){let extra=state.scenario?1:0,p=calculatedPlan(extra),base=calculatedPlan(0),selectedItems=p.items.filter(x=>x.order===selected),lateOrders=[...new Set(p.items.filter(x=>x.late).map(x=>x.order))];return title('Planificació / capacitat de mostra','Càrrega finita per centres','Calendari fictici: 8 h per jornada i un recurs per centre. Seqüència per ordre de cartera, sense optimització.',`<button class="btn ${extra?'secondary':''}" onclick="simulate()">${extra?'Restablir escenari base':'Simular +1 jornada al tractament'}</button>`)+`<div class="metrics">${metric('Operacions pendents',p.items.length,'Calculades des de les rutes')}${metric('Hores de treball',p.items.reduce((n,x)=>n+x.duration,0)+' h','Durades inventades, sense pauses')}${metric('Fi de seqüència','J'+Math.ceil(p.end/8),'Calendari de mostra')}${metric('Objectius superats',lateOrders.length,'Ordres, no compromisos reals','amber')}</div><div class="alert"><div class="alert-content"><span class="symbol">↗</span><div><b>${extra?'Escenari alternatiu · tractament OF-118 +1 jornada':'Escenari base · retorn OF-118 condicionat'}</b><p>Un sol recurs no pot executar dues operacions alhora. Es respecten predecessores; material incomplet s’ajorna a h24 com a supòsit explícit.</p></div></div>${pill('PROPOSTA NO APLICADA','amber')}</div>`+card('Càrrega per centre','Temps de mostra en un horitzó de 5 jornades / 40 h',`<div class="card-body">${Object.entries(p.availability).map(([c,end])=>{let hours=p.items.filter(x=>x.center===c).reduce((n,x)=>n+x.duration,0);return `<div class="chart-row" style="grid-template-columns:150px 1fr 100px"><span>${c}</span><div class="progress ${hours>40?'amber':''}"><i style="width:${Math.min(100,hours/40*100)}%"></i></div><b>${hours} h / 40 h</b></div>`}).join('')}</div>`)+card('Seqüència calculada','Selecciona una ordre per veure operacions i dependències',`<div class="card-body"><select aria-label="Ordre de planificació" onchange="selected=this.value;render()">${baseOrders.map(x=>`<option ${x.id===selected?'selected':''} value="${x.id}">${x.id} · ${x.product}</option>`).join('')}</select></div><div class="table-wrap"><table><thead><tr><th>Operació</th><th>Centre</th><th>Durada</th><th>Inici</th><th>Fi</th><th>Objectiu</th></tr></thead><tbody>${selectedItems.map(x=>`<tr><td>${x.op} · ${x.name}</td><td>${x.center}</td><td>${x.duration} h</td><td>J${Math.floor(x.start/8)+1} · h${x.start%8}</td><td>h${x.finish} · J${Math.ceil(x.finish/8)}</td><td>${pill(x.late?'Superat':'Dins escenari',x.late?'amber':'green')}</td></tr>`).join('')}</tbody></table></div><div class="schedule-note">OF-118: fi base h${Math.max(...base.items.filter(x=>x.order==='OF-118').map(x=>x.finish))}, escenari actual h${Math.max(...p.items.filter(x=>x.order==='OF-118').map(x=>x.finish))}. L’objectiu fictici és h40. No es confirma cap entrega.</div>`)+card('Revisió de proposta','No hi ha botó d’aplicar al taller',`<div class="card-body"><p class="tiny muted">Cal validar temps, calendaris, recursos, materials i prioritats reals. Aquesta mostra només comprova una seqüència sense solapaments sobre les seves pròpies dades.</p><button class="btn secondary" onclick="savePlanReview()">Guardar escenari per revisar</button>${state.v4.planAccepted?'<div class="status-line">Escenari local guardat per revisar. Cap pla real modificat.</div>':''}</div>`)};
function savePlanReview(){state.v4.planAccepted=true;addEvent('Escenari de càrrega guardat per revisar: '+(state.scenario?'+1 jornada':'base')+'. No aplicat a planta.');render()}
function nonconform(){return title('Qualitat / incidències','No-conformitats de mostra','Contenció, proposta i revisió documental separades. Tancar un registre no allibera cap lot.',`<button class="btn" onclick="newNC(selected)">Obrir incidència</button>`)+card('Registre de no-conformitats','Traça conservada en cada canvi',`<div class="table-wrap"><table><thead><tr><th>NC</th><th>Ordre / lot</th><th>Unitats</th><th>Motiu</th><th>Estat</th><th></th></tr></thead><tbody>${state.v4.ncs.map(n=>`<tr><td>${n.id}</td><td>${n.order}<br><small>${order(n.order).lot}</small></td><td>${n.qty}</td><td style="max-width:350px">${esc(n.reason)}</td><td>${pill(n.status,n.status==='Tancada documentalment'?'green':'amber')}</td><td><button class="btn secondary small" onclick="ncModal('${n.id}')">Revisar</button></td></tr>`).join('')}</tbody></table></div><div class="table-hint">Llisca per veure totes les columnes →</div>`)+card('Recorregut del cas','Les peces a revisar no es consideren rebutjades ni conformes automàticament',`<div class="card-body"><div class="route">${['Detectar i identificar','Separar / contenir','Proposar tractament','Revisió responsable','Tancament documental'].map((x,i)=>`<div class="phase"><small>0${i+1}</small><b>${x}</b><span>Amb traça</span></div>`).join('')}</div></div>`)}
function newNC(id){modal('Nova incidència de mostra',`<form onsubmit="saveNC(event)"><label class="fieldlabel" for="ncOrder">Ordre</label><select id="ncOrder">${baseOrders.map(o=>`<option ${o.id===id?'selected':''}>${o.id}</option>`).join('')}</select><div class="split-form" style="margin-top:15px"><div><label class="fieldlabel" for="ncQty">Unitats afectades</label><input id="ncQty" type="number" min="1" step="1" value="1" required></div></div><label class="fieldlabel" for="ncReason">Motiu fictici</label><textarea id="ncReason" required maxlength="500"></textarea><button class="btn" style="margin-top:15px">Obrir registre de mostra</button><div id="ncError"></div></form>`)}
function saveNC(e){e.preventDefault();let id=$('#ncOrder').value,q=Number($('#ncQty').value),reason=$('#ncReason').value.trim();if(!Number.isInteger(q)||q<1||q>order(id).qty||!reason){$('#ncError').innerHTML='<div class="status-line red">Quantitat fora del lot o motiu buit.</div>';return}state.v4.ncs.unshift({id:'NC-'+String(state.v4.ncs.length+1).padStart(3,'0'),order:id,qty:q,reason,status:'Oberta',action:'',evidence:'',history:['Oberta a la demo']});addEvent('Nova no-conformitat de mostra a '+id+'.');closeModal();go('nonconform')}
function ncModal(id){let n=state.v4.ncs.find(x=>x.id===id);modal(id+' · '+n.order,`<p class="tiny">${esc(n.reason)}</p><form onsubmit="updateNC(event,'${id}')"><label class="fieldlabel" for="ncStatus">Pas del registre</label><select id="ncStatus">${['Oberta','En contenció','Proposta pendent','Tancada documentalment'].map(s=>`<option ${s===n.status?'selected':''}>${s}</option>`).join('')}</select><label class="fieldlabel" for="ncAction" style="margin-top:15px">Acció / proposta de mostra</label><textarea id="ncAction" required>${esc(n.action)}</textarea><label class="fieldlabel" for="ncEvidence" style="margin-top:15px">Referència d’evidència per al tancament documental</label><input type="text" id="ncEvidence" value="${esc(n.evidence)}" placeholder="Exemple fictici: REV-NC-001"><label class="check"><input id="ncReviewed" type="checkbox"><span>Revisió de tancament simulada feta. No és conformitat de peces.</span></label><div class="tiny muted">${n.history.map(esc).join('<br>')}</div><button class="btn" style="margin-top:15px">Guardar canvi de mostra</button><div id="ncError"></div></form>`)}
function updateNC(e,id){e.preventDefault();let n=state.v4.ncs.find(x=>x.id===id),status=$('#ncStatus').value,a=$('#ncAction').value.trim(),ev=$('#ncEvidence').value.trim();if(!a||(status==='Tancada documentalment'&&(!ev||!$('#ncReviewed').checked))){$('#ncError').innerHTML='<div class="status-line red">Per tancar cal proposta, referència d’evidència i revisió marcada.</div>';return}n.status=status;n.action=a;n.evidence=ev;n.history.push(status+' · '+a);addEvent(id+': '+status.toLowerCase()+', sense alliberar qualitat.');closeModal();render()}
function changes(){return title('Oficina tècnica / versions','Canvis de revisió','Proposta, impacte i revisió. Les referències originals no se substitueixen automàticament.',`<button class="btn" onclick="newChange(selected)">Nou canvi de mostra</button>`)+card('Propostes de canvi','Revisió de plànol, ruta i documentació',`<div class="table-wrap"><table><thead><tr><th>Canvi</th><th>Ordre</th><th>Revisió</th><th>Motiu</th><th>Estat</th><th></th></tr></thead><tbody>${state.v4.changes.map(c=>`<tr><td>${c.id}</td><td>${c.order}</td><td>${c.from} → ${c.to}</td><td>${esc(c.reason)}</td><td>${pill(c.status,c.status==='Revisat per preparar'?'green':'amber')}</td><td><button class="btn secondary small" onclick="changeModal('${c.id}')">Analitzar impacte</button></td></tr>`).join('')}</tbody></table></div><div class="table-hint">Llisca per veure totes les columnes →</div>`)}
function newChange(id){modal('Proposar revisió · '+id,`<form onsubmit="saveChange(event,'${id}')"><p class="tiny muted">Revisió de mostra actual: ${order(id).revision}. No s’esborra ni substitueix.</p><label class="fieldlabel" for="ecoTo">Nova revisió fictícia</label><input type="text" id="ecoTo" required maxlength="10" value="B"><label class="fieldlabel" for="ecoReason" style="margin-top:15px">Motiu del canvi</label><textarea id="ecoReason" required></textarea><button class="btn" style="margin-top:15px">Crear proposta</button></form>`)}
function saveChange(e,id){e.preventDefault();state.v4.changes.unshift({id:'ECO-'+String(state.v4.changes.length+1).padStart(3,'0'),order:id,from:order(id).revision.split(' · ')[1],to:$('#ecoTo').value,reason:$('#ecoReason').value.trim(),status:'Pendent',note:'',history:['Proposta creada, sense canviar originals']});addEvent('Canvi de revisió proposat a '+id+'.');closeModal();go('changes')}
function changeModal(id){let c=state.v4.changes.find(x=>x.id===id),o=order(c.order);modal(id+' · impacte de revisió',`<h3>${o.id} · ${o.technicalRef} · ${c.from} → ${esc(c.to)}</h3><p class="tiny">${esc(c.reason)}</p><form onsubmit="reviewChange(event,'${id}')">${['Ordre i lot afectats identificats','Ruta i operacions pendents revisades','Documents i controls a preparar identificats'].map((s,i)=>`<label class="check"><input type="checkbox" class="ecoCheck"><span>${s}</span></label>`).join('')}<label class="fieldlabel" for="ecoNote" style="margin-top:12px">Nota de revisió de mostra</label><textarea id="ecoNote" required>${esc(c.note)}</textarea><p class="tiny muted">Afecta la referència ${o.revision}, el lot ${o.lot}, el full de ruta i la carpeta de qualitat de l’ordre. No es modifica cap plànol, programa o ordre real.</p><button class="btn">Guardar revisió d’impacte</button><div id="ecoError"></div></form>`)}
function reviewChange(e,id){e.preventDefault();if([...document.querySelectorAll('.ecoCheck')].some(x=>!x.checked)){$('#ecoError').innerHTML='<div class="status-line red">Cal revisar els tres punts d’impacte.</div>';return}let c=state.v4.changes.find(x=>x.id===id);c.status='Revisat per preparar';c.note=$('#ecoNote').value;c.history.push(c.note);addEvent(id+': impacte revisat per preparar, sense substituir revisió original.');closeModal();render()}
function dispatch(){let id=selected,o=order(id),d=state.v4.dispatch[id]||{},nc=state.v4.ncs.filter(n=>n.order===id&&n.status!=='Tancada documentalment');return title('Preparació / documentació','Preparació d’expedició','Checklist de mostra, no albarà ni autorització de sortida. No es contracta transport ni es declara conformitat.')+`<div class="toolbar"><select aria-label="Ordre d’expedició" onchange="selected=this.value;render()">${baseOrders.map(x=>`<option value="${x.id}" ${x.id===id?'selected':''}>${x.id} · ${x.product}</option>`).join('')}</select></div><div class="grid equal">${card('Dossier · '+id,`${o.lot} · ${o.qty} unitats`, `<div class="card-body">${[['qty','Quantitat i lot contrastats'],['docs','Documents requerits identificats'],['packing','Embalatge de mostra revisat']].map(([k,t])=>`<label class="check"><input type="checkbox" ${d[k]?'checked':''} onchange="dispatchCheck('${k}',this.checked)"><span>${t}</span></label>`).join('')}<p class="tiny muted">Aquests punts són preparació documental; no substitueixen qualitat, requisits del client o permisos d’expedició.</p><button class="btn" onclick="prepareDispatch()">Preparar dossier de mostra</button><div id="dispatchStatus"></div></div>`)}${card('Bloquejos a contrastar','Sense botó d’expedir',`<div class="card-body stack"><div class="event"><span class="dot amber"></span><div><b>${nc.length} incidències documentals obertes</b><p>${nc.map(n=>n.id).join(', ')||'Cap incidència oberta en aquest registre de mostra.'}</p></div></div><div class="event"><span class="dot"></span><div><b>Qualitat no alliberada per la demo</b><p>Ni completar el checklist ni tancar una incidència autoritza l’entrega.</p></div></div><button class="mini-link" onclick="go('nonconform')">Revisar no-conformitats</button></div>`)}</div>${d.prepared?card('Dossier preparat localment','Llista de referències, no documents certificats',`<div class="card-body"><p>${id} · ${o.lot} · ${o.revision}</p><p class="tiny muted">Quantitat de mostra: ${o.qty}. Estat: pendent de validació de qualitat i expedició. Sense destinatari ni transport.</p><button class="btn secondary" onclick="go('summary')">Veure al resum del responsable</button></div>`):''}`}
function dispatchCheck(k,v){state.v4.dispatch[selected]??={};state.v4.dispatch[selected][k]=v;state.v4.dispatch[selected].prepared=false;persist()}
function prepareDispatch(){let d=state.v4.dispatch[selected]||{},blocked=state.v4.ncs.some(n=>n.order===selected&&n.status!=='Tancada documentalment');if(!d.qty||!d.docs||!d.packing||blocked){$('#dispatchStatus').innerHTML='<div class="status-line red" role="alert">Completa el checklist i revisa les incidències obertes abans de preparar el dossier.</div>';return}d.prepared=true;addEvent(selected+': dossier documental de mostra preparat, pendent de qualitat i expedició.');render()}
const v3Summary=buildSummary;buildSummary=function(){let p=calculatedPlan(state.scenario?1:0);return v3Summary().replace('6 ordres, 144 unitats','12 ordres, '+allUnits()+' unitats')+'\n\nSEGUIMENT AMPLIAT DE MOSTRA\n'+baseOrders.slice(6).map(o=>o.id+' · '+o.product+' · '+o.qty+' unitats · '+o.stage).join('\n')+'\n\nCÀRREGA CALCULADA\n'+p.items.length+' operacions pendents, '+p.items.reduce((n,x)=>n+x.duration,0)+' h de treball fictici. Calendari de 8 h per jornada, seqüència sense optimització.\n\nNO-CONFORMITATS\n'+state.v4.ncs.map(n=>n.id+' · '+n.order+' · '+n.status).join('\n')+'\n\nCANVIS DE REVISIÓ\n'+state.v4.changes.map(c=>c.id+' · '+c.order+' · '+c.status).join('\n')+'\n\nDOSSIERS PREPARATS\n'+(Object.entries(state.v4.dispatch).filter(([id,d])=>d.prepared).map(([id])=>id+' · pendent de qualitat i expedició').join('\n')||'Cap dossier preparat.')};
overview=function(){let openNC=state.v4.ncs.filter(n=>n.status!=='Tancada documentalment').length;return title('Producció / cartera de mostra','Producció','Dotze ordres de famílies diferents. Dades fictícies, accions locals i traça per lot.',`<button class="btn secondary" onclick="go('operations')">Terminal de taller</button><button class="btn" onclick="go('summary')">Informe de jornada</button>`)+`<div class="metrics">${metric('Ordres obertes',baseOrders.length,allUnits()+' unitats fictícies')}${metric('Materials incomplets',baseOrders.filter(o=>!materialReady(o)).length,'Conjunts i semielaborats','amber')}${metric('Incidències obertes',openNC,'Registres de mostra','amber')}${metric('Parts registrats',state.parts.length,'Historial acumulatiu')}</div><div class="grid equal">${card('Prioritats de seguiment','Informació que condiciona les properes fases',`<div class="card-body stack"><div class="event"><span class="dot amber"></span><div><b>OF-118 · retorn del tractament</b><p>${esc(state.treatments['TR-041'].return)}. Contrast abans de revisar la seqüència.</p><button class="mini-link" onclick="go('treatments')">Obrir seguiment</button></div></div><div class="event"><span class="dot amber"></span><div><b>OF-126 · disponibilitat de material</b><p>${materialReady(order('OF-126'))?'Necessitat coberta a la mostra.':'64 de 80 unitats inicials; manquen 16 semielaborats.'}</p><button class="mini-link" onclick="selected='OF-126';go('materials')">Veure necessitats</button></div></div><div class="event"><span class="dot"></span><div><b>OF-122 · canvi de revisió</b><p>Proposta ECO-001, sense substituir originals.</p><button class="mini-link" onclick="go('changes')">Analitzar impacte</button></div></div></div>`)}${card('Moviments recents','Canvis i parts vinculats a les ordres',`<div class="card-body stack">${[...state.events.slice(0,3).map(e=>({title:e.text,note:'Canvi local de mostra'})),...state.parts.slice(0,3).map(p=>({title:p.order+' · '+p.type,note:p.note}))].slice(0,4).map(x=>`<div class="event"><span class="dot"></span><div><b>${esc(x.title)}</b><p>${esc(x.note)}</p></div></div>`).join('')}</div>`)}</div>`+card('Cartera de fabricació','Ordres, revisions, materials i fases de mostra',ordersTable(baseOrders),`<button class="mini-link" onclick="go('orders')">Cerca i filtres</button>`)};
const v3Orders=orders;orders=function(){return v3Orders().replace('6 ordres · exemple','12 ordres · exemple')};
const v3Render=render;render=function(){document.querySelector('.nav').innerHTML=modules.map(([id,name],i)=>`<button class="${page===id||(page==='detail'&&id==='orders')?'active':''}" onclick="go('${id}')"><span>${String(i+1).padStart(2,'0')}</span>${name}</button>`).join('');let f={overview,orders,detail,workshop,parts,treatments,quality,technical,operations,materials,nonconform,changes,dispatch,summary:summaryPage};$('#app').innerHTML=f[page]()+foot()};
const v3Reset=resetDemo;resetDemo=function(){state=defaults();state.v4=v4default();baseOrders.forEach(o=>{state.quality[o.id]??={drawing:false,dim:false,certificate:false};state.treatments[o.treatment]??={status:'No aplicable',return:'Sense confirmar',note:'Ruta a revisar segons família.'}});persist();closeModal();page='overview';render();toast('Dades inicials de mostra recuperades.')};render();

</script></body></html>
